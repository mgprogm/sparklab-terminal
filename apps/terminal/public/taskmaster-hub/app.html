<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Task Master Hub</title>
<!--
  Pluggable Task Master Hub artifact. One self-contained document: no CDN,
  imports, fonts, or external requests. Safety: all user-supplied and
  server-derived text is inserted with textContent / DOM nodes, NEVER innerHTML.
-->
<style>
  :root {
    --canvas: #2b2622;
    --canvas-soft: #383330;
    --canvas-softer: #423d39;
    --hairline: #3f3a36;
    --ink: #f7f5f0;
    --body: #c9c0ad;
    --mute: #aea69c;
    --accent: #dad2c1;
    --danger: #e07a6a;
    --prio-low: #7fa6a0;
    --prio-medium: #d8b46a;
    --prio-high: #e0946a;
    --prio-urgent: #e07a6a;
    --radius-sm: 3px;
    --radius-md: 4px;
    --radius-lg: 6px;
    --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --status-pending: #d8b46a;
    --status-in-progress: #7fa6a0;
    --status-done: #8eb878;
    --status-review: #9f8ac7;
    --status-other: #aea69c;
    --status-ready: #b8c98a;
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--canvas);
    color: var(--ink);
    font: 14px/1.4 var(--font);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button,
  input,
  select,
  textarea {
    font: inherit;
  }
  button {
    cursor: pointer;
  }
  button:disabled,
  input:disabled,
  textarea:disabled {
    cursor: not-allowed;
    opacity: 0.5;
  }
  .workspace-toolbar {
    align-items: center;
    background: var(--canvas);
    border-bottom: 1px solid var(--hairline);
    display: flex;
    flex-wrap: wrap;
    gap: 0;
  }
  .topbar {
    display: contents;
  }
  .topbar-main,
  .topbar-tools,
  .panel-header {
    align-items: center;
    display: flex;
    gap: 8px;
  }
  .topbar-main {
    flex: 1 1 420px;
    flex-wrap: wrap;
    padding: 10px 16px;
  }
  .topbar-main > *,
  .topbar-tools > * {
    flex-shrink: 0;
  }
  .topbar-main .project-select,
  .topbar-tools #task-filter,
  .topbar-tools #filter-presets {
    flex-shrink: 1;
  }
  .topbar-tools {
    border-top: 1px solid var(--hairline);
    flex: 1 1 100%;
    flex-wrap: wrap;
    padding: 10px 16px;
  }
  .topbar-tools.hidden {
    display: none;
  }
  .grow {
    flex: 1 1 auto;
  }
  .project-select,
  .field {
    background: var(--canvas-soft);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-sm);
    color: var(--ink);
    padding: 6px 9px;
  }
  .project-select {
    max-width: 340px;
    min-width: 140px;
  }
  .field {
    width: 100%;
  }
  textarea.field {
    min-height: 78px;
    resize: vertical;
  }
  .btn {
    background: var(--canvas-soft);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-sm);
    color: var(--ink);
    padding: 6px 10px;
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) {
    background: var(--canvas-softer);
  }
  .btn-primary {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--canvas);
    font-weight: 500;
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--accent);
    border-color: var(--accent);
  }
  .btn-danger:hover:not(:disabled) {
    color: var(--danger);
  }
  .tag,
  .chip {
    background: var(--canvas-soft);
    border: 1px solid var(--hairline);
    border-radius: 9999px;
    color: var(--body);
    display: inline-flex;
    font-size: 11px;
    line-height: 16px;
    padding: 1px 8px;
    white-space: nowrap;
  }
  .chip.stale {
    border-color: var(--danger);
    color: var(--danger);
  }
  .readonly {
    color: var(--mute);
  }
  #task-filter {
    max-width: 200px;
    min-width: 90px;
  }
  #filter-presets {
    max-width: 150px;
    min-width: 80px;
  }
  .exec-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .exec-row {
    align-items: center;
    color: var(--mute);
    display: flex;
    flex-wrap: wrap;
    font-size: 12px;
    gap: 6px;
  }
  .exec-row.stale {
    color: var(--danger);
  }
  .banner {
    background: rgba(224, 122, 106, 0.12);
    border-bottom: 1px solid var(--hairline);
    color: var(--danger);
    display: none;
    font-size: 13px;
    padding: 8px 16px;
  }
  .banner.show {
    display: block;
  }
  .loading-indicator {
    align-items: center;
    color: var(--mute);
    display: none;
    font-size: 12px;
    gap: 6px;
  }
  .loading-indicator.show {
    display: inline-flex;
  }
  .loading-spinner {
    animation: spin 0.7s linear infinite;
    border: 2px solid var(--hairline);
    border-radius: 50%;
    border-top-color: var(--body);
    display: inline-block;
    flex: none;
    height: 13px;
    width: 13px;
  }
  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }
  .project-form,
  .tag-form {
    align-items: center;
    display: none;
    flex-wrap: wrap;
    gap: 6px;
    width: 100%;
  }
  .project-form.show,
  .tag-form.show {
    display: flex;
  }
  .project-form .field {
    flex: 1 1 150px;
    width: auto;
  }
  .tag-form .field {
    width: 180px;
  }
  #add-task-panel {
    background: transparent;
  }
  #add-task-panel.hidden {
    display: none;
  }
  #rollup-panel {
    background: transparent;
  }
  #rollup-panel.hidden {
    display: none;
  }
  .panel-toggle {
    align-items: center;
    background: none;
    border: none;
    color: var(--body);
    cursor: pointer;
    display: inline-flex;
    font-size: 13px;
    font-weight: 500;
    gap: 5px;
    padding: 4px 0;
  }
  .panel-toggle:hover {
    color: var(--ink);
  }
  .panel-toggle-caret {
    display: inline-block;
    font-size: 10px;
    width: 10px;
  }
  .panel-body {
    display: flex;
    flex: 1 1 100%;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 0 0;
  }
  .panel-body.hidden {
    display: none;
  }
  .workspace-panels {
    align-items: stretch;
    display: flex;
    flex: 0 1 auto;
  }
  .workspace-panel {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-width: 150px;
    padding: 10px 14px;
  }
  .workspace-panel:has(.panel-body:not(.hidden)) {
    flex: 1 1 100%;
  }
  .workspace-panel + .workspace-panel {
    border-left: 1px solid var(--hairline);
  }
  .workspace-panel.hidden {
    display: none;
  }
  .workspace-panel .panel-header {
    flex: 1 1 100%;
  }
  .workspace-panel .panel-body {
    min-width: 0;
  }
  .rollup-strip {
    border-bottom: 1px solid var(--hairline);
    display: flex;
    flex: 1 1 100%;
    flex-direction: column;
    gap: 7px;
    padding: 10px 16px;
  }
  .rollup-strip.hidden {
    display: none;
  }
  .rollup-row {
    align-items: center;
    cursor: pointer;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .rollup-row:hover .rollup-name {
    color: var(--ink);
  }
  .rollup-name {
    color: var(--body);
    font-size: 13px;
    font-weight: 500;
    min-width: 140px;
  }
  #content {
    display: flex;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
  }
  .placeholder {
    align-items: center;
    color: var(--mute);
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: 10px;
    justify-content: center;
    padding: 32px;
    text-align: center;
  }
  .hub {
    display: flex;
    flex: 1;
    gap: 14px;
    min-height: 0;
    overflow: auto;
    padding: 16px;
  }
  .tasks {
    display: flex;
    flex: 1 1 600px;
    flex-direction: column;
    gap: 12px;
    min-width: 360px;
  }
  .status-stack {
    display: grid !important;
    gap: 12px;
    grid-template-columns: repeat(6, minmax(260px, 1fr));
    align-items: start;
    overflow-x: auto;
    padding-bottom: 4px;
    width: 100%;
  }
  .next-tile,
  .bucket {
    background: var(--canvas-soft);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-lg);
  }
  .overview {
    display: grid;
    gap: 7px;
    grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
  }
  .metric {
    background: var(--canvas);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-sm);
    min-width: 0;
    padding: 8px 4px;
    text-align: center;
  }
  .metric b {
    display: block;
    font-size: 18px;
  }
  .metric span {
    color: var(--mute);
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .next-tile {
    padding: 12px;
  }
  .next-title,
  .bucket-head {
    align-items: center;
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .next-title {
    color: var(--body);
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
  }
  .bucket-head {
    border-bottom: 1px solid var(--hairline);
    margin: 0;
    padding: 9px 12px;
  }
  .bucket-name {
    font-size: 13px;
    font-weight: 500;
  }
  .bucket-count {
    color: var(--mute);
    font-size: 12px;
  }
  .bucket-status {
    border-left: 3px solid var(--status-other);
  }
  .bucket-ready {
    border-left: 3px solid var(--status-done);
  }
  .status-pending {
    border-left-color: var(--status-pending);
  }
  .status-in-progress {
    border-left-color: var(--status-in-progress);
  }
  .status-review {
    border-left-color: var(--status-review);
  }
  .status-done {
    border-left-color: var(--status-done);
  }
  .bucket-body {
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 9px;
  }
  .card {
    background: var(--canvas);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-md);
    cursor: pointer;
    padding: 9px;
  }
  .card:hover {
    background: var(--canvas-softer);
  }
  .card-title {
    margin: 4px 0 8px;
    overflow-wrap: anywhere;
  }
  .card-meta {
    align-items: center;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .task-id {
    color: var(--mute);
    font-family: "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 11px;
  }
  .prio-low {
    color: var(--prio-low);
  }
  .prio-medium {
    color: var(--prio-medium);
  }
  .prio-high {
    color: var(--prio-high);
  }
  .status-chip {
    color: var(--status-other);
  }
  .progress-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    margin: 2px 0 8px;
  }
  .progress-cell {
    border-radius: 2px;
    display: inline-block;
    height: 36px;
    width: 36px;
  }
  .progress-cell.status-pending {
    background: var(--status-pending);
  }
  .progress-cell.status-in-progress {
    background: var(--status-in-progress);
    animation: progress-in-progress-blink 1s ease-in-out infinite alternate;
  }
  @keyframes progress-in-progress-blink {
    from {
      opacity: 1;
    }
    to {
      opacity: 0.35;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .progress-cell.status-in-progress,
    .progress-cell.status-review {
      animation: none;
    }
  }
  .progress-cell.status-review {
    background: var(--status-review);
    animation: progress-review-pulse 1.6s ease-in-out infinite;
  }
  @keyframes progress-review-pulse {
    0%,
    100% {
      transform: scale(1);
    }
    50% {
      transform: scale(0.82);
    }
  }
  .progress-cell.status-done {
    background: var(--status-done);
  }
  .progress-cell.status-deferred,
  .progress-cell.status-cancelled {
    background: var(--status-other);
  }
  .progress-cell.status-blocked {
    background: var(--danger);
  }
  .progress-cell.ready {
    background: var(--status-ready);
  }
  .progress-cell[role="button"] {
    cursor: pointer;
  }
  .progress-cell[role="button"]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .task-grid {
    margin: 6px 0 2px;
  }
  .task-grid-progress {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0 0 4px;
    font-size: 11px;
    color: var(--mute);
  }
  .task-grid-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
    margin: 2px 0 8px;
    font-size: 11px;
    color: var(--mute);
    align-items: center;
  }
  .task-grid-legend-item {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .card-select {
    flex: none;
  }
  .bulk-toolbar {
    align-items: center;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 12px;
  }
  .bulk-toolbar .field {
    max-width: 160px;
    width: auto;
  }
  .bulk-count {
    color: var(--body);
    font-size: 12px;
  }
  .bulk-results {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 8px;
    width: 100%;
  }
  .bulk-result-row {
    align-items: center;
    display: flex;
    gap: 8px;
    font-size: 12px;
  }
  .bulk-result-icon {
    flex: none;
    font-size: 12px;
    width: 14px;
  }
  .bulk-result-icon.ok {
    color: var(--status-done);
  }
  .bulk-result-icon.fail {
    color: var(--danger);
  }
  .bulk-result-icon .loading-spinner {
    height: 11px;
    width: 11px;
  }
  .other-controls {
    margin-left: auto;
    max-width: 150px;
    padding: 3px 5px;
  }
  .empty {
    color: var(--mute);
    font-size: 13px;
    padding: 6px 3px;
  }
  .overlay {
    align-items: stretch;
    background: rgba(0, 0, 0, 0.5);
    display: none;
    inset: 0;
    justify-content: flex-end;
    padding: 12px;
    position: fixed;
    z-index: 10;
  }
  .overlay.show {
    display: flex;
  }
  .detail {
    background: var(--canvas);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-lg);
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 620px;
    overflow-y: auto;
    padding: 18px;
    width: 100%;
  }
  .detail-head {
    align-items: flex-start;
    display: flex;
    gap: 10px;
  }
  .detail-head h2 {
    font-size: 17px;
    margin: 0;
    overflow-wrap: anywhere;
  }
  .close {
    margin-left: auto;
  }
  .section {
    border-top: 1px solid var(--hairline);
    padding-top: 12px;
  }
  .section h3 {
    color: var(--body);
    font-size: 12px;
    margin: 0 0 7px;
    text-transform: uppercase;
  }
  pre {
    background: var(--canvas-soft);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-sm);
    color: var(--body);
    font:
      12px/1.45 "SF Mono",
      "Cascadia Code",
      Menlo,
      Consolas,
      monospace;
    margin: 0;
    overflow: auto;
    padding: 9px;
    white-space: pre-wrap;
  }
  .action-row {
    align-items: end;
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }
  .action-row .field {
    flex: 1 1 180px;
  }
  .binary-note {
    color: var(--mute);
    font-size: 11px;
    margin: 4px 0 0;
  }
  .subtask {
    border-bottom: 1px solid var(--hairline);
    color: var(--body);
    padding: 5px 0;
  }
  .subtask:last-child {
    border-bottom: 0;
  }
  .dependency-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .dependency {
    align-items: center;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .dependency-label {
    color: var(--mute);
    font-size: 11px;
  }
  @media (max-width: 650px) {
    .hub {
      padding: 10px;
    }
    .detail {
      max-width: none;
    }
    .project-select {
      max-width: 100%;
    }
    .topbar-main {
      flex-wrap: wrap;
    }
    .workspace-panels {
      border-top: 1px solid var(--hairline);
      flex: 1 1 100%;
    }
    .workspace-panel + .workspace-panel {
      border-left: 0;
      border-top: 1px solid var(--hairline);
    }
  }
</style>

<section class="workspace-toolbar" aria-label="Project workspace controls">
<div class="topbar">
  <div class="topbar-main">
    <select
      id="project-select"
      class="project-select"
      aria-label="Select project"
    ></select>
    <span id="current-tag" class="tag"></span>
    <span class="grow"></span>
    <button id="refresh-project" class="btn" type="button">Refresh</button>
    <button
      id="auto-refresh-project"
      class="btn"
      type="button"
      aria-pressed="false"
    >
      Auto-refresh: Off
    </button>
    <button
      id="topbar-tools-toggle"
      class="panel-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="topbar-tools"
    >
      <span class="panel-toggle-caret">▸</span> Project &amp; filters
    </button>
  </div>
  <div id="topbar-tools" class="topbar-tools hidden">
    <input
      id="task-filter"
      class="field"
      type="search"
      placeholder="Filter tasks…"
      autocomplete="off"
    />
    <select
      id="filter-presets"
      class="field"
      aria-label="Filter presets"
    ></select>
    <button id="save-filter" class="btn" type="button">Save filter</button>
    <button id="switch-tag" class="btn" type="button">Switch tag</button>
    <button id="add-project" class="btn btn-primary" type="button">
      Add project
    </button>
    <button id="remove-project" class="btn btn-danger" type="button">
      Remove project
    </button>
    <form id="project-form" class="project-form">
      <input
        id="project-name"
        class="field"
        type="text"
        placeholder="Name (optional)"
        autocomplete="off"
      />
      <select id="server-select" class="field" aria-label="Server"></select>
      <input
        id="project-path"
        class="field"
        type="text"
        placeholder="/home/user/my-project"
        autocomplete="off"
        required
      />
      <button class="btn btn-primary" type="submit">Add</button>
      <button id="cancel-project" class="btn" type="button">Cancel</button>
    </form>
    <form id="tag-form" class="tag-form">
      <select
        id="tag-name"
        class="field"
        aria-label="Tag to switch to"
        required
      ></select>
      <button class="btn btn-primary" type="submit">Switch</button>
      <button id="cancel-tag" class="btn" type="button">Cancel</button>
    </form>
  </div>
</div>
<div id="banner" class="banner" role="alert"></div>
<div class="workspace-panels">
  <div id="add-task-panel" class="workspace-panel hidden">
    <div class="panel-header">
      <button
        id="add-task-panel-toggle"
        class="panel-toggle"
        type="button"
        aria-expanded="false"
      >
        <span class="panel-toggle-caret">▸</span> Add task
      </button>
      <span class="grow"></span>
      <span id="loading-indicator" class="loading-indicator" role="status">
        <span class="loading-spinner"></span>
        Updating…
      </span>
    </div>
    <div id="add-task-body" class="panel-body hidden">
      <button id="add-task-btn" class="btn btn-primary" type="button">
        + Add task
      </button>
      <span id="add-task-note" class="binary-note"></span>
      <form id="add-task-form" class="project-form">
        <textarea
          id="add-task-prompt"
          class="field"
          placeholder="Task prompt"
          autocomplete="off"
          required
        ></textarea>
        <select
          id="add-task-priority"
          class="field"
          aria-label="Priority"
        ></select>
        <input
          id="add-task-deps"
          class="field"
          type="text"
          placeholder="Dependencies (comma-separated task ids)"
          autocomplete="off"
        />
        <button class="btn btn-primary" type="submit">Add task</button>
        <button id="add-task-cancel" class="btn" type="button">Cancel</button>
      </form>
    </div>
  </div>
  <div id="rollup-panel" class="workspace-panel hidden">
    <div class="panel-header">
      <button
        id="rollup-panel-toggle"
        class="panel-toggle"
        type="button"
        aria-expanded="false"
      >
        <span class="panel-toggle-caret">▸</span> Search all projects
      </button>
    </div>
    <div id="rollup-body" class="panel-body hidden">
      <button id="rollup-refresh" class="btn" type="button">
        Refresh project rollup
      </button>
      <span id="rollup-loading" class="loading-indicator" role="status">
        <span class="loading-spinner"></span>
        Refreshing…
      </span>
      <input
        id="cross-search-input"
        class="field"
        type="search"
        placeholder="Search all tasks…"
        autocomplete="off"
      />
      <button id="cross-search-btn" class="btn" type="button">
        Search tasks
      </button>
      <div id="rollup-strip" class="rollup-strip hidden"></div>
      <div id="cross-search-results" class="rollup-strip hidden"></div>
    </div>
  </div>
</div>
</section>
<div id="content"></div>

<div id="detail-overlay" class="overlay">
  <section id="detail" class="detail" aria-label="Task detail"></section>
</div>

<script>
  "use strict";
  function loadSavedFilters() {
    try {
      var saved = JSON.parse(localStorage.getItem("taskmasterHub.savedFilters"));
      return Array.isArray(saved)
        ? saved.filter(function (filter) {
            return (
              filter &&
              typeof filter.name === "string" &&
              typeof filter.query === "string"
            );
          })
        : [];
    } catch (e) {
      return [];
    }
  }
  function loadPanelCollapsed(key) {
    try {
      var v = localStorage.getItem(key);
      return v === null ? true : v === "1";
    } catch (e) {
      return true;
    }
  }
  function wirePanelToggle(toggleBtn, bodyEl, storageKey) {
    var collapsed = loadPanelCollapsed(storageKey);
    var caret = toggleBtn.querySelector(".panel-toggle-caret");
    function apply() {
      bodyEl.classList.toggle("hidden", collapsed);
      toggleBtn.setAttribute("aria-expanded", String(!collapsed));
      caret.textContent = collapsed ? "▸" : "▾";
    }
    apply();
    toggleBtn.addEventListener("click", function () {
      collapsed = !collapsed;
      try {
        localStorage.setItem(storageKey, collapsed ? "1" : "0");
      } catch (e) {}
      apply();
    });
  }
  var state = {
    projects: [],
    servers: [],
    projectId: null,
    project: null,
    tasks: [],
    next: null,
    overview: null,
    currentTag: null,
    tags: [],
    detailTaskId: null,
    detailTask: null,
    detailLoading: false,
    refreshing: false,
    refreshToken: 0,
    autoRefreshEnabled: false,
    autoRefreshInterval: null,
    hasLoadedProjectData: false,
    otherFilter: "collapsed",
    taskFilter: "",
    savedFilters: loadSavedFilters(),
    nextSubtasksTaskId: null,
    nextSubtasks: null,
    bulkSelected: {},
    bulkTargetStatus: "in-progress",
    bulkRunning: false,
    bulkResults: null,
    rollup: null,
    rollupRunning: false,
    crossSearchQuery: "",
    crossSearchResults: [],
    crossSearchRunning: false,
  };
  var STATUS = [
    "pending",
    "in-progress",
    "done",
    "deferred",
    "cancelled",
    "blocked",
    "review",
  ];
  var el = {
    projectSelect: document.getElementById("project-select"),
    removeProject: document.getElementById("remove-project"),
    currentTag: document.getElementById("current-tag"),
    switchTag: document.getElementById("switch-tag"),
    taskFilter: document.getElementById("task-filter"),
    filterPresets: document.getElementById("filter-presets"),
    saveFilter: document.getElementById("save-filter"),
    topbarToolsToggle: document.getElementById("topbar-tools-toggle"),
    topbarToolsBody: document.getElementById("topbar-tools"),
    addProject: document.getElementById("add-project"),
    projectForm: document.getElementById("project-form"),
    projectName: document.getElementById("project-name"),
    serverSelect: document.getElementById("server-select"),
    projectPath: document.getElementById("project-path"),
    cancelProject: document.getElementById("cancel-project"),
    tagForm: document.getElementById("tag-form"),
    tagName: document.getElementById("tag-name"),
    cancelTag: document.getElementById("cancel-tag"),
    addTaskPanel: document.getElementById("add-task-panel"),
    addTaskPanelToggle: document.getElementById("add-task-panel-toggle"),
    addTaskBody: document.getElementById("add-task-body"),
    addTaskBtn: document.getElementById("add-task-btn"),
    addTaskNote: document.getElementById("add-task-note"),
    addTaskForm: document.getElementById("add-task-form"),
    addTaskPrompt: document.getElementById("add-task-prompt"),
    addTaskPriority: document.getElementById("add-task-priority"),
    addTaskDeps: document.getElementById("add-task-deps"),
    addTaskCancel: document.getElementById("add-task-cancel"),
    banner: document.getElementById("banner"),
    refreshProject: document.getElementById("refresh-project"),
    autoRefreshProject: document.getElementById("auto-refresh-project"),
    loadingIndicator: document.getElementById("loading-indicator"),
    rollupPanel: document.getElementById("rollup-panel"),
    rollupPanelToggle: document.getElementById("rollup-panel-toggle"),
    rollupBody: document.getElementById("rollup-body"),
    rollupRefresh: document.getElementById("rollup-refresh"),
    rollupLoading: document.getElementById("rollup-loading"),
    rollupStrip: document.getElementById("rollup-strip"),
    crossSearchInput: document.getElementById("cross-search-input"),
    crossSearchBtn: document.getElementById("cross-search-btn"),
    crossSearchResults: document.getElementById("cross-search-results"),
    content: document.getElementById("content"),
    detailOverlay: document.getElementById("detail-overlay"),
    detail: document.getElementById("detail"),
  };
  [
    ["", "No preference"],
    ["low", "low"],
    ["medium", "medium"],
    ["high", "high"],
  ].forEach(function (item) {
    var option = elem("option", null, item[1]);
    option.value = item[0];
    el.addTaskPriority.appendChild(option);
  });

  function ApiError(status, message) {
    this.status = status;
    this.message = message || "Request failed";
  }
  ApiError.prototype = Object.create(Error.prototype);
  async function api(method, path, body) {
    var opts = { method: method, headers: {}, credentials: "same-origin" };
    if (body !== undefined) {
      opts.headers["content-type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    var res;
    try {
      res = await fetch("/api/taskmaster" + path, opts);
    } catch (e) {
      throw new ApiError(0, "Network error — is the gateway reachable?");
    }
    if (res.status === 204) return null;
    var data = null,
      text = await res.text();
    if (text) {
      try {
        data = JSON.parse(text);
      } catch (e) {
        data = null;
      }
    }
    if (!res.ok) {
      var err = new ApiError(
        res.status,
        (data && data.error) || res.statusText || "Request failed",
      );
      err.body = data;
      throw err;
    }
    return data;
  }
  function showBanner(message) {
    el.banner.textContent = message;
    el.banner.classList.add("show");
  }
  function clearBanner() {
    el.banner.textContent = "";
    el.banner.classList.remove("show");
  }
  function handleError(e) {
    if (e && e.status === 401)
      showBanner("Session expired — reload the page to sign in again.");
    else showBanner((e && e.message) || "Something went wrong.");
  }
  function elem(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }
  function projectPath(id) {
    return "/projects/" + encodeURIComponent(id);
  }
  function renderFilterPresets() {
    el.filterPresets.textContent = "";
    var placeholder = elem("option", null, "Filter presets");
    placeholder.value = "";
    el.filterPresets.appendChild(placeholder);
    state.savedFilters.forEach(function (filter, index) {
      var option = elem("option", null, filter.name);
      option.value = String(index);
      el.filterPresets.appendChild(option);
    });
  }
  function applyTaskFilter(value) {
    el.taskFilter.value = value;
    state.taskFilter = value.trim().toLowerCase();
    renderContent();
  }
  function currentProject() {
    return (
      state.projects.find(function (p) {
        return p.id === state.projectId;
      }) || null
    );
  }
  function isBinary() {
    return state.project && state.project.binaryMode === "binary";
  }
  function statusClass(status) {
    return "status-" + String(status || "other").replace(/[^a-z-]/g, "");
  }
  function setRefreshState(refreshing) {
    state.refreshing = refreshing;
    el.loadingIndicator.classList.toggle("show", refreshing);
    el.content.setAttribute("aria-busy", String(refreshing));
    el.refreshProject.disabled = refreshing || !state.projectId;
  }
  function renderAutoRefreshToggle() {
    el.autoRefreshProject.textContent = state.autoRefreshEnabled
      ? "Auto-refresh: On (30s)"
      : "Auto-refresh: Off";
    el.autoRefreshProject.setAttribute(
      "aria-pressed",
      String(state.autoRefreshEnabled),
    );
  }
  function setAutoRefresh(enabled) {
    state.autoRefreshEnabled = enabled;
    if (state.autoRefreshInterval !== null) {
      window.clearInterval(state.autoRefreshInterval);
      state.autoRefreshInterval = null;
    }
    if (enabled) {
      state.autoRefreshInterval = window.setInterval(function () {
        if (!state.projectId || state.refreshing) return;
        refreshProjectData().catch(handleError);
      }, 30000);
    }
    renderAutoRefreshToggle();
  }

  var HUMAN_AGENT_ID = "human";
  // Matches the gateway's documented default (TASKMASTER_CLAIM_TTL_MS); not
  // surfaced by the API today, so this is a display-only approximation.
  var CLAIM_TTL_MS_CLIENT = 30 * 60 * 1000;
  function findExecution(taskId) {
    var runs = (state.overview && state.overview.executions) || [];
    return runs.find(function (r) {
      return String(r.taskId) === String(taskId);
    });
  }
  function executionLabel(run) {
    return (
      (run.agentRole || "Developer") +
      " · " +
      run.agentName +
      " · " +
      (run.agentTool || "Agent Chat") +
      " · " +
      run.status
    );
  }
  function formatElapsed(ms) {
    if (ms < 60000) return "just now";
    var m = Math.floor(ms / 60000);
    if (m < 60) return m + "m";
    return Math.floor(m / 60) + "h " + (m % 60) + "m";
  }
  function isStaleClaim(run) {
    return Date.now() - run.claimedAt > CLAIM_TTL_MS_CLIENT * 0.8;
  }
  function setPending(btn, label) {
    if (btn.dataset.originalText === undefined)
      btn.dataset.originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = label;
  }
  function clearPending(btn) {
    if (btn.dataset.originalText !== undefined)
      btn.textContent = btn.dataset.originalText;
  }

  function renderProjectSelect() {
    el.rollupPanel.classList.toggle("hidden", !state.projects.length);
    if (!state.projects.length) {
      state.rollup = null;
      renderRollupStrip();
    }
    el.projectSelect.textContent = "";
    if (!state.projects.length) {
      var none = elem("option", null, "No projects");
      none.value = "";
      el.projectSelect.appendChild(none);
      el.projectSelect.disabled = true;
      el.removeProject.disabled = true;
      return;
    }
    el.projectSelect.disabled = false;
    el.removeProject.disabled = false;
    state.projects.forEach(function (project) {
      var label = project.name || project.path;
      if (project.binaryMode === "core-only-npx")
        label += " (read-only — no task-master binary on that server)";
      var option = elem("option", null, label);
      option.value = project.id;
      option.selected = project.id === state.projectId;
      if (project.binaryMode === "core-only-npx")
        option.style.color = "#aea69c";
      el.projectSelect.appendChild(option);
    });
  }
  function renderRollupStrip() {
    el.rollupLoading.classList.toggle("show", state.rollupRunning);
    el.rollupRefresh.disabled = state.rollupRunning;
    el.rollupStrip.textContent = "";
    if (!state.rollup) {
      el.rollupStrip.classList.add("hidden");
      return;
    }
    el.rollupStrip.classList.remove("hidden");
    state.rollup.forEach(function (entry) {
      var row = elem("div", "rollup-row");
      row.appendChild(elem("span", "rollup-name", entry.name));
      if (entry.loading) {
        row.appendChild(elem("span", "loading-spinner"));
      } else if (entry.error) {
        row.appendChild(elem("span", "chip stale", entry.error));
      } else {
        var c = entry.counts || {};
        [
          ["ready", "ready"],
          ["inProgress", "in progress"],
          ["blocked", "blocked"],
          ["done", "done"],
        ].forEach(function (item) {
          row.appendChild(
            elem("span", "chip", (c[item[0]] || 0) + " " + item[1]),
          );
        });
      }
      row.addEventListener("click", function () {
        if (entry.id === state.projectId) return;
        selectProject(entry.id).catch(handleError);
      });
      el.rollupStrip.appendChild(row);
    });
  }
  async function refreshRollup() {
    if (state.rollupRunning || !state.projects.length) return;
    state.rollupRunning = true;
    state.rollup = state.projects.map(function (project) {
      return {
        id: project.id,
        name: project.name || project.path,
        loading: true,
        counts: null,
        error: null,
      };
    });
    renderRollupStrip();
    await Promise.all(
      state.rollup.map(function (entry) {
        return api("GET", projectPath(entry.id) + "/overview")
          .then(function (data) {
            entry.loading = false;
            entry.counts = (data && data.counts) || {};
          })
          .catch(function (e) {
            entry.loading = false;
            entry.error = (e && e.message) || "Failed to load";
          })
          .finally(renderRollupStrip);
      }),
    );
    state.rollupRunning = false;
    renderRollupStrip();
  }
  function renderCrossSearchResults() {
    el.crossSearchBtn.disabled = state.crossSearchRunning;
    el.crossSearchResults.textContent = "";
    el.crossSearchResults.classList.remove("hidden");
    if (state.crossSearchRunning) {
      el.crossSearchResults.appendChild(elem("span", "loading-spinner"));
      return;
    }
    if (!state.crossSearchResults.length) {
      el.crossSearchResults.appendChild(
        elem("div", "empty", "No matching tasks found."),
      );
      return;
    }
    state.crossSearchResults.forEach(function (entry) {
      var row = elem("div", "rollup-row");
      row.appendChild(elem("span", "rollup-name", entry.projectName));
      row.appendChild(
        elem("span", "chip", entry.taskId + ": " + entry.title),
      );
      row.addEventListener("click", function () {
        selectProject(entry.projectId)
          .then(function () {
            applyTaskFilter(entry.taskId);
          })
          .catch(handleError);
      });
      el.crossSearchResults.appendChild(row);
    });
  }
  async function runCrossProjectSearch() {
    if (state.crossSearchRunning) return;
    state.crossSearchQuery = el.crossSearchInput.value.trim().toLowerCase();
    state.crossSearchRunning = true;
    state.crossSearchResults = [];
    renderCrossSearchResults();
    try {
      var results = await Promise.all(
        state.projects.map(function (project) {
          return api("GET", projectPath(project.id) + "/tasks")
            .then(function (data) {
              return ((data && data.tasks) || [])
                .filter(function (task) {
                  return matchesTaskQuery(task, state.crossSearchQuery);
                })
                .map(function (task) {
                  return {
                    projectId: project.id,
                    projectName: project.name || project.path,
                    taskId: String(task.id),
                    title: task.title || "",
                  };
                });
            })
            .catch(function () {
              return [];
            });
        }),
      );
      state.crossSearchResults = results.flat();
    } finally {
      state.crossSearchRunning = false;
      renderCrossSearchResults();
    }
  }
  function renderTag() {
    el.currentTag.textContent =
      state.projectId && state.currentTag ? "tag: " + state.currentTag : "";
    el.currentTag.style.display = state.projectId ? "inline-flex" : "none";
    el.switchTag.disabled = !state.projectId || state.tags.length < 2;
    el.taskFilter.disabled = !state.projectId;
    el.refreshProject.disabled = !state.projectId || state.refreshing;
    renderTagOptions();
    renderAddTaskGate();
  }
  function renderTagOptions() {
    el.tagName.textContent = "";
    state.tags.forEach(function (name) {
      var opt = elem("option", null, name);
      opt.value = name;
      if (name === state.currentTag) opt.selected = true;
      el.tagName.appendChild(opt);
    });
  }
  function renderAddTaskGate() {
    var disabled = !state.project || !isBinary(),
      submit = el.addTaskForm.querySelector('button[type="submit"]');
    el.addTaskPanel.classList.toggle("hidden", !state.project);
    el.addTaskBtn.disabled = disabled;
    el.addTaskPrompt.disabled = disabled;
    el.addTaskPriority.disabled = disabled;
    el.addTaskDeps.disabled = disabled;
    submit.disabled = disabled;
    el.addTaskNote.textContent = disabled
      ? "Requires the task-master binary"
      : "";
  }
  function renderServers() {
    el.serverSelect.textContent = "";
    state.servers.forEach(function (server) {
      var option = elem("option", null, server.name);
      option.value = server.id;
      el.serverSelect.appendChild(option);
    });
  }

  async function loadProjects(preferId) {
    var data = await api("GET", "/projects");
    state.projects = (data && data.projects) || [];
    var ids = state.projects.map(function (p) {
      return p.id;
    });
    state.projectId =
      (preferId && ids.indexOf(preferId) >= 0 && preferId) ||
      (state.projectId &&
        ids.indexOf(state.projectId) >= 0 &&
        state.projectId) ||
      (state.projects[0] && state.projects[0].id) ||
      null;
    state.project = currentProject();
    renderProjectSelect();
    if (state.projectId) await selectProject(state.projectId);
    else {
      state.tasks = [];
      state.next = null;
      state.currentTag = null;
      state.tags = [];
      renderTag();
      renderContent();
    }
  }
  async function loadServers() {
    state.servers = await fetchServers();
    renderServers();
  }
  async function fetchServers() {
    var res;
    try {
      res = await fetch("/api/servers", { credentials: "same-origin" });
    } catch (e) {
      throw new ApiError(0, "Network error — is the gateway reachable?");
    }
    var data = null,
      text = await res.text();
    if (text) {
      try {
        data = JSON.parse(text);
      } catch (e) {
        data = null;
      }
    }
    if (!res.ok) {
      var err = new ApiError(
        res.status,
        (data && data.error) || res.statusText || "Request failed",
      );
      err.body = data;
      throw err;
    }
    return Array.isArray(data) ? data : [];
  }
  async function selectProject(id) {
    state.projectId = id;
    state.project = currentProject();
    state.tasks = [];
    state.next = null;
    state.nextSubtasksTaskId = null;
    state.nextSubtasks = null;
    state.bulkSelected = {};
    state.bulkResults = null;
    state.currentTag = null;
    state.tags = [];
    state.detailTaskId = null;
    state.detailTask = null;
    state.hasLoadedProjectData = false;
    renderProjectSelect();
    renderTag();
    renderContent();
    await refreshProjectData();
  }
  async function refreshProjectData() {
    var id = state.projectId;
    if (!id) return;
    var token = ++state.refreshToken;
    setRefreshState(true);
    try {
      var results = await Promise.all([
        api("GET", projectPath(id) + "/tasks"),
        api("GET", projectPath(id) + "/next"),
        api("GET", projectPath(id) + "/tags"),
        api("GET", projectPath(id) + "/overview"),
      ]);
      if (state.projectId !== id || state.refreshToken !== token) return;
      state.tasks = (results[0] && results[0].tasks) || [];
      state.next = results[1] || null;
      state.currentTag = results[2] && results[2].currentTag;
      state.tags = (results[2] && results[2].tags) || [];
      state.overview = results[3] || null;
      state.hasLoadedProjectData = true;
      renderTag();
      renderContent();
    } finally {
      if (state.refreshToken === token) setRefreshState(false);
    }
  }
  async function refreshAfterUnknown() {
    showBanner(
      "Task Master may have already made this change — the request timed out before we could confirm. Refreshing the task list…",
    );
    try {
      await refreshProjectData();
      if (state.detailTaskId) await loadDetail(state.detailTaskId);
    } catch (e) {
      handleError(e);
    }
  }
  function handleMutationError(e) {
    if (e && e.status === 504 && e.body && e.body.code === "outcome_unknown") {
      void refreshAfterUnknown();
      return;
    }
    handleError(e);
  }

  function renderContent() {
    var previousHub = el.content.querySelector(".hub");
    var scrollTop = previousHub ? previousHub.scrollTop : 0;
    el.content.textContent = "";
    if (!state.projects.length) {
      var empty = elem(
        "div",
        "placeholder",
        "Add a Task Master project to get started.",
      );
      el.content.appendChild(empty);
      return;
    }
    if (!state.project || (state.refreshing && !state.hasLoadedProjectData)) {
      el.content.appendChild(elem("div", "placeholder", "Loading project…"));
      return;
    }
    var hub = elem("div", "hub"),
      tasks = elem("div", "tasks"),
      visibleTasks = state.tasks.filter(matchesTaskFilter),
      readyTasks = visibleTasks.filter(isReadyTask);
    tasks.appendChild(renderOverview());
    tasks.appendChild(renderNextTile());
    var bulkToolbar = renderBulkToolbar();
    if (bulkToolbar) tasks.appendChild(bulkToolbar);
    var statusStack = elem("div", "status-stack");
    statusStack.setAttribute("aria-label", "Tasks by status");
    statusStack.appendChild(renderReadyBucket(readyTasks));
    ["pending", "in-progress", "review", "done"].forEach(function (status) {
      statusStack.appendChild(
        renderBucket(
          status,
          visibleTasks.filter(function (task) {
            return (
              task.status === status &&
              (status !== "pending" || !isReadyTask(task))
            );
          }),
        ),
      );
    });
    statusStack.appendChild(renderOtherBucket(visibleTasks));
    tasks.appendChild(statusStack);
    hub.appendChild(tasks);
    el.content.appendChild(hub);
    hub.scrollTop = scrollTop;
  }
  function renderOverview() {
    var box = elem("section", "next-tile");
    box.appendChild(elem("div", "next-title", "PM overview"));
    var grid = elem("div", "overview"),
      c = (state.overview && state.overview.counts) || {},
      runs = (state.overview && state.overview.executions) || [],
      subAgentCount = new Set(
        runs
          .filter(function (run) {
            return run.agentId !== HUMAN_AGENT_ID;
          })
          .map(function (run) {
            return run.agentId;
          }),
      ).size;
    [
      ["total", "tasks"],
      ["ready", "ready"],
      ["inProgress", "in progress"],
      ["blocked", "blocked"],
      ["done", "done"],
      ["activeAgents", "active agents"],
      [subAgentCount, "sub-agents"],
    ].forEach(function (item) {
      var card = elem("div", "metric");
      card.appendChild(
        elem("b", null, String(typeof item[0] === "string" ? c[item[0]] || 0 : item[0])),
      );
      card.appendChild(elem("span", null, item[1]));
      grid.appendChild(card);
    });
    box.appendChild(grid);
    if (runs.length) {
      var list = elem("div", "exec-list");
      runs.forEach(function (run) {
        var stale = isStaleClaim(run),
          row = elem("div", "exec-row" + (stale ? " stale" : ""));
        row.appendChild(elem("span", "task-id", "#" + run.taskId));
        row.appendChild(document.createTextNode(executionLabel(run)));
        row.appendChild(
          elem(
            "span",
            "chip" + (stale ? " stale" : ""),
            formatElapsed(Date.now() - run.claimedAt),
          ),
        );
        list.appendChild(row);
      });
      box.appendChild(list);
    } else box.appendChild(elem("div", "empty", "No agent has claimed a task."));
    return box;
  }
  function ensureNextSubtasksLoaded(taskId) {
    if (state.nextSubtasksTaskId === taskId) return;
    state.nextSubtasksTaskId = taskId;
    state.nextSubtasks = null;
    var id = state.projectId;
    api("GET", projectPath(id) + "/tasks/" + encodeURIComponent(taskId))
      .then(function (task) {
        if (state.projectId !== id || state.nextSubtasksTaskId !== taskId) return;
        state.nextSubtasks = Array.isArray(task.subtasks) ? task.subtasks : [];
        renderContent();
      })

  async function applyBulkStatus(ids, status) {

        dependsOn: value,
      })
        .then(function (updated) {
          state.detailTask = updated;
          dependsOn.value = "";
          renderDetail();
          return refreshProjectData();
        })
        .catch(function (e) {
          if (
            e &&
            e.status === 400 &&
            e.body &&
            e.body.code === "dependency_cycle"
          )
            showBanner("This would create a circular dependency.");
          else handleMutationError(e);
        })
        .finally(function () {
          clearPending(depButton);
          depButton.disabled = !isBinary();
        });
    });
    section.appendChild(depForm);
    var expandRow = elem("div", "action-row"),
      researchLabel = elem("label", null),
      research = elem("input");
    research.type = "checkbox";
    research.disabled = !binary;
    researchLabel.appendChild(research);
    researchLabel.appendChild(document.createTextNode(" Research"));
    var expand = elem("button", "btn", "Expand");
    expand.type = "button";
    expand.disabled = !binary;
    expand.title = binary ? "" : "Requires the task-master binary";
    expand.addEventListener("click", function () {
      setPending(expand, "Expanding…");
      var body = {};
      if (research.checked) body.research = true;
      api(
        "POST",
        projectPath(state.projectId) +
          "/tasks/" +
          encodeURIComponent(task.id) +
          "/expand",
        body,
      )
        .then(function (updated) {
          state.detailTask = updated;
          renderDetail();
          return refreshProjectData();
        })
        .catch(handleMutationError)
        .finally(function () {
          clearPending(expand);
          expand.disabled = !isBinary();
        });
    });
    expandRow.appendChild(researchLabel);
    expandRow.appendChild(expand);
    section.appendChild(expandRow);
    var promptForm = elem("form", "section"),
      prompt = elem("textarea", "field");
    prompt.placeholder = "Update via prompt";
    prompt.disabled = !binary;
    var promptButton = elem("button", "btn btn-primary", "Update via prompt");
    promptButton.type = "submit";
    promptButton.disabled = !binary;
    promptButton.title = binary ? "" : "Requires the task-master binary";
    promptForm.appendChild(prompt);
    promptForm.appendChild(promptButton);
    promptForm.addEventListener("submit", function (event) {
      event.preventDefault();
      var value = prompt.value.trim();
      if (!value || !binary) return;
      setPending(promptButton, "Updating…");
      api(
        "PATCH",
        projectPath(state.projectId) + "/tasks/" + encodeURIComponent(task.id),
        { prompt: value },
      )
        .then(function (updated) {
          state.detailTask = updated;
          prompt.value = "";
          renderDetail();
          return refreshProjectData();
        })
        .catch(handleMutationError)
        .finally(function () {
          clearPending(promptButton);
          promptButton.disabled = !isBinary();
        });
    });
    section.appendChild(promptForm);
    return section;
  }

  el.projectSelect.addEventListener("change", function () {
    if (el.projectSelect.value)
      selectProject(el.projectSelect.value).catch(handleError);
  });
  el.taskFilter.addEventListener("input", function () {
    applyTaskFilter(el.taskFilter.value);
  });
  el.refreshProject.addEventListener("click", function () {
    refreshProjectData().catch(handleError);
  });
  el.autoRefreshProject.addEventListener("click", function () {
    setAutoRefresh(!state.autoRefreshEnabled);
  });
  el.filterPresets.addEventListener("change", function () {
    if (el.filterPresets.value === "") return;
    var index = Number(el.filterPresets.value);
    var filter = state.savedFilters[index];
    if (filter) applyTaskFilter(filter.query);
    el.filterPresets.value = "";
  });
  el.saveFilter.addEventListener("click", function () {
    var name = window.prompt("Save this filter as:");
    if (!name) return;
    state.savedFilters.push({ name: name, query: state.taskFilter });
    localStorage.setItem(
      "taskmasterHub.savedFilters",
      JSON.stringify(state.savedFilters),
    );
    renderFilterPresets();
  });
  el.crossSearchBtn.addEventListener("click", function () {
    void runCrossProjectSearch();
  });
  el.crossSearchInput.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      void runCrossProjectSearch();
    }
  });
  el.rollupRefresh.addEventListener("click", function () {
    void refreshRollup();
  });
  el.addProject.addEventListener("click", function () {
    if (el.topbarToolsToggle.getAttribute("aria-expanded") === "false") {
      el.topbarToolsToggle.click();
    }
    el.projectForm.classList.add("show");
    el.projectName.focus();
  });
  el.cancelProject.addEventListener("click", function () {
    el.projectForm.classList.remove("show");
  });
  el.projectForm.addEventListener("submit", function (event) {
    event.preventDefault();
    var path = el.projectPath.value.trim();
    if (!path) return;
    api("POST", "/projects", {
      name: el.projectName.value.trim() || undefined,
      serverId: el.serverSelect.value,
      path: path,
    })
      .then(function (project) {
        el.projectForm.reset();
        el.projectForm.classList.remove("show");
        return loadProjects(project.id);
      })
      .catch(handleError);
  });
  el.removeProject.addEventListener("click", function () {
    var project = currentProject();
    if (
      !project ||
      !window.confirm(
        'Remove "' +
          (project.name || project.path) +
          '" from this Hub? This only removes the registry entry; project files are unchanged.',
      )
    )
      return;
    api("DELETE", projectPath(project.id))
      .then(function () {
        state.projectId = null;
        return loadProjects();
      })
      .catch(handleError);
  });
  el.switchTag.addEventListener("click", function () {
    if (el.topbarToolsToggle.getAttribute("aria-expanded") === "false") {
      el.topbarToolsToggle.click();
    }
    el.tagForm.classList.add("show");
    el.tagName.focus();
  });
  el.cancelTag.addEventListener("click", function () {
    el.tagForm.classList.remove("show");
  });
  el.tagForm.addEventListener("submit", function (event) {
    event.preventDefault();
    var name = el.tagName.value.trim();
    if (!name || !state.projectId) return;
    if (name === state.currentTag) {
      el.tagForm.classList.remove("show");
      return;
    }
    if (
      !window.confirm(
        'Switch the active tag for this project to "' +
          name +
          '"? This affects every tool (CLI, agent, this Hub) using this project.',
      )
    )
      return;
    api("POST", projectPath(state.projectId) + "/tags/use", { name: name })
      .then(function (data) {
        state.currentTag = data.currentTag;
        el.tagForm.reset();
        el.tagForm.classList.remove("show");
        renderTag();
        return refreshProjectData();
      })
      .catch(function (e) {
        if (e && e.status === 503)
          showBanner(
            "task-master isn't installed on that server — tag switching isn't available.",
          );
        else handleError(e);
      });
  });
  el.addTaskBtn.addEventListener("click", function () {
    el.addTaskForm.classList.add("show");
    el.addTaskPrompt.focus();
  });
  el.addTaskCancel.addEventListener("click", function () {
    el.addTaskForm.reset();
    el.addTaskForm.classList.remove("show");
  });
  el.addTaskForm.addEventListener("submit", function (event) {
    event.preventDefault();
    var prompt = el.addTaskPrompt.value.trim(),
      priority = el.addTaskPriority.value,
      deps = el.addTaskDeps.value
        .split(",")
        .map(function (id) {
          return id.trim();
        })
        .filter(Boolean),
      submit = el.addTaskForm.querySelector('button[type="submit"]');
    if (!prompt || !isBinary()) return;
    setPending(submit, "Adding…");
    var body = {
      prompt: prompt,
      ...(priority ? { priority: priority } : {}),
      ...(deps.length ? { dependencies: deps } : {}),
    };
    api("POST", projectPath(state.projectId) + "/tasks", body)
      .then(function (response) {
        state.tasks = response.tasks || [];
        el.addTaskForm.reset();
        el.addTaskForm.classList.remove("show");
        renderContent();
        return refreshProjectData();
      })
      .catch(handleMutationError)
      .finally(function () {
        clearPending(submit);
        submit.disabled = !isBinary();
      });
  });
  el.detailOverlay.addEventListener("mousedown", function (event) {
    if (event.target === el.detailOverlay) closeDetail();
  });
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") closeDetail();
  });

  wirePanelToggle(
    el.topbarToolsToggle,
    el.topbarToolsBody,
    "taskmasterHub.topbarToolsCollapsed",
  );
  wirePanelToggle(
    el.addTaskPanelToggle,
    el.addTaskBody,
    "taskmasterHub.addTaskCollapsed",
  );
  wirePanelToggle(
    el.rollupPanelToggle,
    el.rollupBody,
    "taskmasterHub.rollupCollapsed",
  );
  renderFilterPresets();
  Promise.all([loadServers(), loadProjects()]).catch(handleError);
</script>
