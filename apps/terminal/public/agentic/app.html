<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agentic AI Creator</title>
<!--
  Pluggable Agentic AI Creator artifact (AGENTIC-AI-CREATOR-PLAN.md D8: ONE
  artifact, an in-app catalog — NOT a per-app artifact).

  SCOPE (iter1 + iter2): a catalog + a minimal Run view. The catalog lists
  Agentic AIs from GET /api/agentic/apps (name + status badge + agent/connection
  counts), offers a "New Agentic AI" form (POST /api/agentic/apps), and a
  publish/unpublish toggle (PATCH /api/agentic/apps/:id/status). The Run view
  (iter2) picks a target terminal session, starts a run (POST /apps/:id/run),
  polls GET /runs/:id to render per-node status + tailed logs, and can Kill
  (DELETE /runs/:id). The full visual Builder / workflow-DAG editor and the
  human-approval UI are later, human-checkpointed iterations and are deliberately
  NOT built here.

  A SINGLE self-contained document — inline <style> + inline <script>, ZERO
  external requests (no CDN, no fetched web fonts, no imports). Loaded into a
  same-origin sandboxed <iframe> by components/agentic-dialog.tsx; it talks to
  the gateway over relative /api/agentic/* fetches, which carry the app-origin
  gw_session cookie through the Next proxy.

  Palette/type are hardcoded to mirror DESIGN.md (a documented exception to the
  "use Tailwind tokens" rule — this isolated document has no access to the
  app's theme tokens).

  Safety: all user-supplied text is injected via textContent / DOM nodes, never
  innerHTML, so names/descriptions cannot inject markup.
-->
<style>
  :root {
    --canvas: #2b2622;
    --canvas-soft: #383330;
    --canvas-softer: #423d39;
    --hairline: #3f3a36;
    --ink: #f7f5f0;
    --body: #c9c0ad;
    --mute: #aea69c;
    --accent: #dad2c1;
    --danger: #e07a6a;
    --ok: #8fb98a;
    --radius-sm: 3px;
    --radius-md: 4px;
    --radius-lg: 6px;
    --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
    margin: 0;
  }

    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.4;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  button {
    font-family: inherit;
    font-size: inherit;
    cursor: pointer;
  }

  input,
  textarea {
    font-family: inherit;
    font-size: 13px;
  }

    font-weight: 500;

  }

  .topbar .grow {

    min-width: 0;
  }

  .btn {
    background: var(--canvas-soft);
    color: var(--ink);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-sm);
    padding: 6px 12px;
    transition: background 0.12s ease, border-color 0.12s ease;
    white-space: nowrap;
  }

  .btn:hover {
    background: var(--canvas-softer);
  }

  .btn-primary {
    background: var(--ink);
    color: var(--canvas);
    border-color: var(--ink);
    font-weight: 500;
  }

  .btn-primary:hover {
    background: var(--accent);
    border-color: var(--accent);
  }

  .btn-ghost {
    background: transparent;
    border-color: transparent;
    color: var(--mute);
    padding: 4px 8px;
  }

  .btn-ghost:hover {
    color: var(--ink);
    background: var(--canvas-soft);
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* ---- Banner ---- */
  .banner {
    display: none;
    padding: 8px 16px;
    background: rgba(224, 122, 106, 0.12);
    border-bottom: 1px solid var(--hairline);
    color: var(--danger);
    font-size: 13px;
  }

  .banner.show {
    display: block;
  }

  /* ---- Catalog ---- */
  .catalog {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
    align-content: start;
  }

  .app-card {
    background: var(--canvas-soft);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-lg);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .app-head {
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }

  .app-name {
    font-size: 14px;
    font-weight: 500;

  .badge-draft {

  }

  /* ---- Modal ---- */

  .modal {

    justify-content: flex-end;
  }

  /* ---- Run view (iteration 2) ---- */
  .run-view {
    display: none;
    flex: 1 1 auto;
    min-height: 0;

  }

  .run-head .run-title {

    font-weight: 500;

  }

  }

  .node-id {

    font-weight: 500;
    flex: 1 1 auto;
    min-width: 0;

  .tool-log-time {

  /* Scrollbars */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }

  ::-webkit-scrollbar-thumb {
    background: var(--hairline);
    border-radius: 9999px;
  }
</style>

<script>
  "use strict";

  // ---------------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------------
  var state = {
    apps: [], // summaries: {id,name,status,orchestrationMode,agentCount,connectionCount,version,...}
    view: "catalog", // "catalog" | "run"
    runApp: null, // the app being run (a catalog summary)
    activeRunId: null, // the id of the run currently being polled
    pollToken: 0, // bumped to invalidate in-flight poll ticks
    pollTimer: null, // the setTimeout handle for the poll loop
  };

  var el = {
    newAppBtn: document.getElementById("new-app-btn"),
    banner: document.getElementById("banner"),
    catalog: document.getElementById("catalog"),
    newAppOverlay: document.getElementById("new-app-overlay"),
    newAppForm: document.getElementById("new-app-form"),
    naName: document.getElementById("na-name"),
    naDesc: document.getElementById("na-desc"),
    naMode: document.getElementById("na-mode"),
    // Run view
    runView: document.getElementById("run-view"),
    runBack: document.getElementById("run-back-btn"),
    runTitle: document.getElementById("run-title"),
    runForm: document.getElementById("run-form"),
    runSession: document.getElementById("run-session"),
    runObjective: document.getElementById("run-objective"),
    runStartBtn: document.getElementById("run-start-btn"),
    runActive: document.getElementById("run-active"),
    runStatusBadge: document.getElementById("run-status-badge"),
    runStatusMeta: document.getElementById("run-status-meta"),
    runObjectiveEcho: document.getElementById("run-objective-echo"),
    runKillBtn: document.getElementById("run-kill-btn"),
    runNewBtn: document.getElementById("run-new-btn"),
    nodeList: document.getElementById("node-list"),
    toolLog: document.getElementById("tool-log"),
  };

  // Run status buckets — mirror the gateway's RUN_TERMINAL set (agentic.js).
  var RUN_TERMINAL = { completed: true, failed: true, cancelled: true };
  var POLL_INTERVAL_MS = 1500;

  // ---------------------------------------------------------------------------
  // API layer
  // ---------------------------------------------------------------------------
  function ApiError(status, message) {
    this.status = status;
    this.message = message || "Request failed";
  }
  ApiError.prototype = Object.create(Error.prototype);

  // Performs a same-origin JSON fetch. On non-2xx, throws ApiError with the
  // parsed body attached (`.body`).
  async function api(method, path, body) {
    var opts = { method: method, headers: {}, credentials: "same-origin" };
    if (body !== undefined) {
      opts.headers["content-type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    var res;
    try {
      res = await fetch("/api/agentic" + path, opts);
    } catch (e) {
      throw new ApiError(0, "Network error — is the gateway reachable?");
    }
    if (res.status === 204) return null;
    var data = null;
    var text = await res.text();
    if (text) {
      try {
        data = JSON.parse(text);
      } catch (e) {
        data = null;
      }
    }
    if (!res.ok) {
      var err = new ApiError(
        res.status,
        (data && data.error) || res.statusText || "Request failed",
      );
      err.body = data;
      throw err;
    }
    return data;
  }

  // ---------------------------------------------------------------------------
  // Error / banner handling
  // ---------------------------------------------------------------------------
  function showBanner(message) {
    el.banner.textContent = message;
    el.banner.classList.add("show");
  }

  function clearBanner() {
    el.banner.textContent = "";
    el.banner.classList.remove("show");
  }

  function handleError(e) {
    if (e && e.status === 401) {
      showBanner("Session expired — reload the page to sign in again.");
      return;
    }
    showBanner((e && e.message) || "Something went wrong.");
  }

  // ---------------------------------------------------------------------------
  // DOM helpers (textContent-only; never innerHTML with user data)
  // ---------------------------------------------------------------------------
  function elem(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function plural(n, one, many) {
    return n + " " + (n === 1 ? one : many);
  }

  // ---------------------------------------------------------------------------
  // Data loading
  // ---------------------------------------------------------------------------
  async function loadApps() {
    clearBanner();
    var data;
    try {
      data = await api("GET", "/apps");
    } catch (e) {
      handleError(e);
      state.apps = [];
      renderCatalog();
      return;
    }
    state.apps = (data && data.apps) || [];
    renderCatalog();
  }

  // ---------------------------------------------------------------------------
  // Mutations
  // ---------------------------------------------------------------------------
  async function createApp(fields) {
    await api("POST", "/apps", fields);
    await loadApps();
  }

  // Publish / unpublish via the status endpoint. draft -> published and back.
  async function togglePublish(app) {
    var next = app.status === "published" ? "draft" : "published";
    await api("PATCH", "/apps/" + encodeURIComponent(app.id) + "/status", {
      status: next,
    });
    await loadApps();
  }

  async function deleteApp(app) {
    await api("DELETE", "/apps/" + encodeURIComponent(app.id));
    await loadApps();
  }

  // ---------------------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------------------
  function renderCatalog() {
    var root = el.catalog;
    root.textContent = "";

    if (state.apps.length === 0) {
      var empty = elem("div", "placeholder");
      empty.appendChild(elem("h2", null, "No Agentic AIs yet"));
      empty.appendChild(
        elem(
          "div",
          null,
          'Create your first one with "New Agentic AI" above.',
        ),
      );
      root.appendChild(empty);
      return;
    }

    state.apps.forEach(function (app) {
      root.appendChild(renderAppCard(app));
    });
  }

  function renderAppCard(app) {
    var card = elem("div", "app-card");

    var head = elem("div", "app-head");
    head.appendChild(elem("span", "app-name", app.name));
    var status = app.status || "draft";
    head.appendChild(elem("span", "badge badge-" + status, status));
    card.appendChild(head);

    card.appendChild(elem("div", "app-mode", app.orchestrationMode || "single"));

    var meta = elem("div", "app-meta");
    meta.appendChild(
      elem("span", null, plural(app.agentCount || 0, "agent", "agents")),
    );
    meta.appendChild(
      elem(
        "span",
        null,
        plural(app.connectionCount || 0, "connection", "connections"),
      ),
    );
    meta.appendChild(elem("span", null, "v" + (app.version || 1)));
    card.appendChild(meta);

    var actions = elem("div", "app-actions");

    var runBtn = elem("button", "btn", "Run");
    runBtn.type = "button";
    runBtn.addEventListener("click", function () {
      openRunView(app);
    });
    actions.appendChild(runBtn);

    var pubBtn = elem(
      "button",
      "btn btn-ghost",
      app.status === "published" ? "Unpublish" : "Publish",
    );
    pubBtn.type = "button";
    pubBtn.addEventListener("click", function () {
      togglePublish(app).catch(handleError);
    });
    actions.appendChild(pubBtn);

    actions.appendChild(elem("span", "grow"));

    var delBtn = elem("button", "btn btn-ghost", "Delete");
    delBtn.type = "button";
    delBtn.addEventListener("click", function () {
      if (window.confirm('Delete "' + app.name + '"? This cannot be undone.')) {
        deleteApp(app).catch(handleError);
      }
    });
    actions.appendChild(delBtn);

    card.appendChild(actions);
    return card;
  }

  // ---------------------------------------------------------------------------
  // Run view (iteration 2)
  // ---------------------------------------------------------------------------

  // The session list lives at the bare /api/sessions endpoint, NOT under
  // /api/agentic — the api() helper hardcodes the agentic prefix, so this fetch
  // is done directly. Returns a plain array; we keep reachable sessions only.
  async function loadSessions() {
    var res;
    try {
      res = await fetch("/api/sessions", { credentials: "same-origin" });
    } catch (e) {
      throw new ApiError(0, "Network error — is the gateway reachable?");
    }
    if (!res.ok) throw new ApiError(res.status, "Failed to load sessions");
    var list = await res.json();
    if (!Array.isArray(list)) return [];
    return list.filter(function (s) {
      return s && s.reachable !== false;
    });
  }

  function sessionLabel(s) {
    var name = s.name || s.id;
    if (s.serverId && s.serverId !== "local") name += " (" + s.serverId + ")";
    return name;
  }

  async function populateSessionPicker() {
    var sel = el.runSession;
    sel.textContent = "";
    var loading = elem("option", null, "Loading sessions…");
    loading.value = "";
    sel.appendChild(loading);
    var sessions;
    try {
      sessions = await loadSessions();
    } catch (e) {
      sel.textContent = "";
      var errOpt = elem("option", null, "Could not load sessions");
      errOpt.value = "";
      sel.appendChild(errOpt);
      throw e;
    }
    sel.textContent = "";
    if (sessions.length === 0) {
      var none = elem("option", null, "No reachable sessions");
      none.value = "";
      sel.appendChild(none);
      return;
    }
    sessions.forEach(function (s) {
      var opt = elem("option", null, sessionLabel(s));
      opt.value = s.id;
      sel.appendChild(opt);
    });
  }

  function setView(view) {
    state.view = view;
    var isRun = view === "run";
    el.runView.classList.toggle("show", isRun);
    el.catalog.style.display = isRun ? "none" : "";
    el.newAppBtn.style.display = isRun ? "none" : "";
    if (!isRun) stopPolling();
  }

  function openRunView(app) {
    clearBanner();
    state.runApp = app;
    state.activeRunId = null;
    stopPolling();
    el.runTitle.textContent = "Run · " + app.name;
    el.runObjective.value = "";
    el.runForm.style.display = "";
    el.runActive.style.display = "none";
    el.nodeList.textContent = "";
    setView("run");
    populateSessionPicker().catch(handleError);
  }

  function leaveRunView() {
    stopPolling();
    state.runApp = null;
    state.activeRunId = null;
    setView("catalog");
  }

  async function startRunForApp() {
    var app = state.runApp;
    if (!app) return;
    var sessionId = el.runSession.value;
    if (!sessionId) {
      showBanner("Pick a reachable target session first.");
      return;
    }
    clearBanner();
    el.runStartBtn.disabled = true;
    var run;
    try {
      run = await api(
        "POST",
        "/apps/" + encodeURIComponent(app.id) + "/run",
        { sessionId: sessionId, objective: el.runObjective.value },
      );
    } catch (e) {
      el.runStartBtn.disabled = false;
      handleError(e);
      return;
    }
    el.runStartBtn.disabled = false;
    if (!run || !run.id) {
      showBanner("Run did not start (no run id returned).");
      return;
    }
    state.activeRunId = run.id;
    el.runForm.style.display = "none";
    el.runActive.style.display = "";
    renderRun(run);
    // A run may already be terminal (a fast/empty job): only poll if not.
    if (!RUN_TERMINAL[run.status]) startPolling();
  }

  function startPolling() {
    stopPolling();
    var token = ++state.pollToken;
    var tick = async function () {
      if (token !== state.pollToken) return; // superseded
      var runId = state.activeRunId;
      if (!runId) return;
      var run;
      try {
        run = await api("GET", "/runs/" + encodeURIComponent(runId));
      } catch (e) {
        if (token !== state.pollToken) return;
        // A transient poll failure shouldn't tear the view down — surface it
        // and keep trying on the next tick.
        handleError(e);
        state.pollTimer = window.setTimeout(tick, POLL_INTERVAL_MS);
        return;
      }
      if (token !== state.pollToken) return;
      renderRun(run);
      if (RUN_TERMINAL[run.status]) {
        stopPolling();
        return;
      }
      state.pollTimer = window.setTimeout(tick, POLL_INTERVAL_MS);
    };
    state.pollTimer = window.setTimeout(tick, POLL_INTERVAL_MS);
  }

  function stopPolling() {
    state.pollToken++;
    if (state.pollTimer) {
      window.clearTimeout(state.pollTimer);
      state.pollTimer = null;
    }
  }

  async function killActiveRun() {
    var runId = state.activeRunId;
    if (!runId) return;
    el.runKillBtn.disabled = true;
    try {
      await api("DELETE", "/runs/" + encodeURIComponent(runId));
    } catch (e) {
      el.runKillBtn.disabled = false;
      handleError(e);
      return;
    }
    el.runKillBtn.disabled = false;
    // Poll once more so the cancelled state + final logs are reflected.
    try {
      var run = await api("GET", "/runs/" + encodeURIComponent(runId));
      renderRun(run);
      if (RUN_TERMINAL[run.status]) stopPolling();
    } catch (e) {
      /* the next poll tick will reconcile */
    }
  }

  function fmtDuration(startedAt, finishedAt) {
    if (!startedAt) return "";
    var end = finishedAt || Date.now();
    var ms = end - startedAt;
    if (ms < 0) ms = 0;
    var s = Math.round(ms / 1000);
    if (s < 60) return s + "s";
    var m = Math.floor(s / 60);
    return m + "m " + (s % 60) + "s";
  }

  function renderRun(run) {
    var status = run.status || "running";
    el.runStatusBadge.className = "badge badge-" + status;
    el.runStatusBadge.textContent = status;

    var terminal = !!RUN_TERMINAL[status];
    el.runKillBtn.style.display = terminal ? "none" : "";
    el.runNewBtn.style.display = terminal ? "" : "none";

    var meta = "v" + (run.agenticAiVersion || 1);
    var dur = fmtDuration(run.startedAt, run.finishedAt);
    if (dur) meta += " · " + dur;
    el.runStatusMeta.textContent = meta;

    el.runObjectiveEcho.textContent = run.objective
      ? "Objective: " + run.objective
      : "";

    renderToolCallLog(run);

    el.nodeList.textContent = "";
    var nodes = run.nodeExecutions || [];
    if (nodes.length === 0) {
      el.nodeList.appendChild(
        elem("div", "run-meta", "This run has no steps to execute."),
      );
      return;
    }
    nodes.forEach(function (ne) {
      el.nodeList.appendChild(renderNode(ne));
    });
  }

  function renderNode(ne) {
    var card = elem("div", "node-card");

    var head = elem("div", "node-head");
    var label = ne.nodeId || "step";
    if (ne.parentNodeId) label = ne.parentNodeId + " › " + label;
    head.appendChild(elem("span", "node-id", label));

    var dur = fmtDuration(ne.startedAt, ne.finishedAt);
    if (dur) head.appendChild(elem("span", "node-dur", dur));

    var st = ne.status || "pending";
    head.appendChild(elem("span", "badge badge-" + st, st));
    card.appendChild(head);

    // Iter3: a node parked on an MCP tool-call approval carries a persisted
    // pendingToolCall. Gate on BOTH the node status AND the record's own status
    // — once resolved, pendingToolCall stays but flips to approved/rejected, so
    // requiring "pending" is what stops a decided call from re-showing here.
    var ptc = ne.pendingToolCall;
    if (ne.status === "waiting-approval" && ptc && ptc.status === "pending") {
      card.appendChild(renderApprovalBanner(ne.nodeId, ptc));
    }

    if (ne.logTail) {
      card.appendChild(elem("pre", "node-log", ne.logTail));
    }
    return card;
  }

  // Prominent per-node approval banner. All fields via textContent. The pending
  // record carries only connectionId (no targetType — that's a toolCallLog-only
  // field), so we surface connectionId here and never fabricate a type.
  function renderApprovalBanner(nodeId, ptc) {
    var box = elem("div", "approval-box");
    box.appendChild(
      elem("div", "approval-title", "Tool call awaiting approval"),
    );

    var grid = elem("div", "approval-grid");
    grid.appendChild(elem("span", "approval-key", "Tool"));
    grid.appendChild(elem("span", "approval-val", ptc.toolName || "—"));
    grid.appendChild(elem("span", "approval-key", "Connection"));
    grid.appendChild(elem("span", "approval-val", ptc.connectionId || "—"));
    box.appendChild(grid);

    if (ptc.argsPreview) {
      box.appendChild(elem("div", "approval-key", "Arguments"));
      box.appendChild(elem("pre", "approval-args", ptc.argsPreview));
    }

    var actions = elem("div", "approval-actions");
    var approveBtn = elem("button", "btn btn-primary", "Approve");
    approveBtn.type = "button";
    var rejectBtn = elem("button", "btn btn-danger", "Reject");
    rejectBtn.type = "button";
    approveBtn.addEventListener("click", function () {
      approveBtn.disabled = true;
      rejectBtn.disabled = true;
      decidePendingCall(nodeId, ptc.id, "approve", null);
    });
    rejectBtn.addEventListener("click", function () {
      // Host iframe carries allow-modals (verified), so prompt() is safe and
      // blocks the poll loop while open. Cancel (null) aborts; empty = no reason.
      var reason = window.prompt("Reason for rejecting (optional):", "");
      if (reason === null) return;
      approveBtn.disabled = true;
      rejectBtn.disabled = true;
      decidePendingCall(nodeId, ptc.id, "reject", reason.trim() || undefined);
    });
    actions.appendChild(approveBtn);
    actions.appendChild(rejectBtn);
    box.appendChild(actions);
    return box;
  }

  // POST the human decision. Both routes return the fresh Run (200); we render
  // it immediately, then keep polling so the resolution + downstream steps show.
  async function decidePendingCall(nodeId, pendingId, decision, reason) {
    var runId = state.activeRunId;
    if (!runId) return;
    clearBanner();
    var path =
      "/runs/" +
      encodeURIComponent(runId) +
      "/nodes/" +
      encodeURIComponent(nodeId) +
      "/" +
      decision;
    var body = { pendingId: pendingId };
    if (decision === "reject" && reason) body.reason = reason;
    var run;
    try {
      run = await api("POST", path, body);
    } catch (e) {
      handleError(e);
      return;
    }
    if (run) {
      renderRun(run);
      if (!RUN_TERMINAL[run.status]) startPolling();
      else stopPolling();
    }
  }

  function fmtTime(ts) {
    if (!ts) return "";
    var d = new Date(ts);
    if (isNaN(d.getTime())) return String(ts);
    return d.toLocaleTimeString();
  }

  // Run-level audit trail (iter3): allow/deny/approved/rejected/timed_out
  // dispositions. textContent-only; bounded + scrollable via CSS.
  function renderToolCallLog(run) {
    var wrap = el.toolLog;
    wrap.textContent = "";
    var log = run.toolCallLog || [];
    if (log.length === 0) {
      wrap.style.display = "none";
      return;
    }
    wrap.style.display = "";
    wrap.appendChild(elem("div", "tool-log-title", "Tool call log"));
    var list = elem("div", "tool-log-list");
    log.forEach(function (entry) {
      var row = elem("div", "tool-log-row");
      var disp = entry.disposition || "";
      row.appendChild(
        elem("span", "tool-log-disp disp-" + disp, disp || "—"),
      );
      row.appendChild(elem("span", "tool-log-tool", entry.toolName || "—"));
      var conn = entry.connectionId || "";
      if (entry.targetType) {
        conn = entry.targetType + " · " + (entry.connectionId || "—");
      }
      row.appendChild(elem("span", "tool-log-conn", conn || "—"));
      row.appendChild(elem("span", "tool-log-time", fmtTime(entry.at)));
      list.appendChild(row);
    });
    wrap.appendChild(list);
  }

  // ---------------------------------------------------------------------------
  // Modals
  // ---------------------------------------------------------------------------
  function openOverlay(overlay) {
    overlay.classList.add("show");
  }
  function closeOverlay(overlay) {
    overlay.classList.remove("show");
  }

  document.querySelectorAll("[data-close]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      closeOverlay(document.getElementById(btn.getAttribute("data-close")));
    });
  });
  el.newAppOverlay.addEventListener("mousedown", function (e) {
    if (e.target === el.newAppOverlay) closeOverlay(el.newAppOverlay);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeOverlay(el.newAppOverlay);
  });

  // ---------------------------------------------------------------------------
  // Wiring
  // ---------------------------------------------------------------------------
  el.newAppBtn.addEventListener("click", function () {
    el.naName.value = "";
    el.naDesc.value = "";
    el.naMode.value = "single";
    openOverlay(el.newAppOverlay);
    el.naName.focus();
  });

  el.newAppForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var name = el.naName.value.trim();
    if (!name) return;
    var fields = {
      name: name,
      description: el.naDesc.value,
      orchestrationMode: el.naMode.value,
    };
    closeOverlay(el.newAppOverlay);
    createApp(fields).catch(handleError);
  });

  // ---- Run view wiring ----
  el.runBack.addEventListener("click", leaveRunView);

  el.runForm.addEventListener("submit", function (e) {
    e.preventDefault();
    startRunForApp();
  });

  el.runKillBtn.addEventListener("click", function () {
    killActiveRun();
  });

  // "New run" (shown once a run is terminal) resets the run view for the same
  // app so the operator can fire another run without leaving.
  el.runNewBtn.addEventListener("click", function () {
    if (state.runApp) openRunView(state.runApp);
  });

  // Don't keep hammering the gateway while the modal/tab is hidden (the host
  // dialog keeps this iframe mounted). Resume polling a live run when visible.
  document.addEventListener("visibilitychange", function () {
    if (state.view !== "run" || !state.activeRunId) return;
    if (document.hidden) {
      stopPolling();
    } else {
      startPolling();
    }
  });

  // ---------------------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------------------
  void loadApps();
</script>
