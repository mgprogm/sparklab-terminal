  function renderAddColumn() {
    var wrap = elem("div", "add-column");

    var trigger = elem("button", "btn", "+ Add column");
    trigger.type = "button";

    var form = elem("form", "add-column-form");
    var input = elem("input", "field");
    input.type = "text";
    input.placeholder = "Column name";
    input.setAttribute("autocomplete", "off");
    input.required = true;
    var rowEnd = elem("div", "row-end");
    var cancel = elem("button", "btn", "Cancel");
    cancel.type = "button";
    var add = elem("button", "btn btn-primary", "Add");
    add.type = "submit";
    rowEnd.appendChild(cancel);
    rowEnd.appendChild(add);
    form.appendChild(input);
    form.appendChild(rowEnd);

    function open() {
      trigger.style.display = "none";
      form.classList.add("show");
      input.focus();
    }
    function close() {
      form.classList.remove("show");
      trigger.style.display = "";
      input.value = "";
    }

    trigger.addEventListener("click", open);
    cancel.addEventListener("click", close);
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var name = input.value.trim();
      if (!name) return;
      add.disabled = true;
      close();
      createColumn(name)
        .catch(handleError)
        .finally(function () {
          add.disabled = false;
        });
    });

    wrap.appendChild(trigger);
    wrap.appendChild(form);
    return wrap;
  }

  function renderColumn(project, col, byId, colIdx) {
    var colEl = elem("div", "column");

    var head = elem("div", "column-head");
    head.appendChild(elem("span", "column-name", col.name));

    // WIP badge: show N/limit when limit set, just N otherwise.
    var wipText;
    if (col.wipLimit != null) {
      wipText = col.taskIds.length + "/" + col.wipLimit;
    } else {
      wipText = String(col.taskIds.length);
    }
    var wipBadge = elem("span", "wip-badge", wipText);
    if (col.wipLimit != null && col.taskIds.length >= col.wipLimit) {
      wipBadge.classList.add("at-limit");
    }
    wipBadge.style.marginLeft = "auto";
    head.appendChild(wipBadge);

    // Column menu (triple-dot).
    var menuWrap = elem("span", "col-menu-wrap");
    var menuBtn = elem("button", "col-menu-btn", "⋯");
    menuBtn.type = "button";
    menuBtn.setAttribute("aria-label", "Column options for " + col.name);
    menuBtn.setAttribute("aria-haspopup", "menu");
    var menu = elem("div", "col-menu");
    menu.setAttribute("role", "menu");

    // Rename
    var renameItem = elem("button", "col-menu-item", "Rename");
    renameItem.type = "button";
    renameItem.setAttribute("role", "menuitem");
    renameItem.addEventListener("click", function () {
      closeColMenu(menu);
      var newName = window.prompt("Rename column:", col.name);
      if (newName && newName.trim() && newName.trim() !== col.name) {
        updateColumn(col.id, { name: newName.trim() }).catch(handleError);
      }
    });
    menu.appendChild(renameItem);

    // Set WIP limit
    var wipItem = elem("button", "col-menu-item", "Set WIP limit");
    wipItem.type = "button";
    wipItem.setAttribute("role", "menuitem");
    wipItem.addEventListener("click", function () {
      closeColMenu(menu);
      var current = col.wipLimit != null ? String(col.wipLimit) : "";
      var raw = window.prompt(
        "WIP limit (positive number, or leave empty for no limit):",
        current,
      );
      if (raw === null) return; // cancelled
      var val = raw.trim();
      if (val === "") {
        updateColumn(col.id, { wipLimit: null }).catch(handleError);
      } else {
        var n = parseInt(val, 10);
        if (!isNaN(n) && n >= 1) {
          updateColumn(col.id, { wipLimit: n }).catch(handleError);
        } else {
          showBanner("WIP limit must be a positive number or empty for no limit.");
        }
      }
    });
    menu.appendChild(wipItem);

    // Set allowed transitions
    var transItem = elem("button", "col-menu-item", "Allowed transitions");
    transItem.type = "button";
    transItem.setAttribute("role", "menuitem");
    transItem.addEventListener("click", function () {
      closeColMenu(menu);
      openTransitionsDialog(project, col);
    });
    menu.appendChild(transItem);

    var sep1 = elem("div", "col-menu-sep");
    menu.appendChild(sep1);

    // Move left / Move right
    if (colIdx > 0) {
      var moveLeftItem = elem("button", "col-menu-item", "Move left");
      moveLeftItem.type = "button";
      moveLeftItem.setAttribute("role", "menuitem");
      moveLeftItem.addEventListener("click", function () {
        closeColMenu(menu);
        moveColumn(col.id, colIdx - 1).catch(handleError);
      });
      menu.appendChild(moveLeftItem);
    }
    if (colIdx < project.columns.length - 1) {
      var moveRightItem = elem("button", "col-menu-item", "Move right");
      moveRightItem.type = "button";
      moveRightItem.setAttribute("role", "menuitem");
      moveRightItem.addEventListener("click", function () {
        closeColMenu(menu);
        moveColumn(col.id, colIdx + 1).catch(handleError);
      });
      menu.appendChild(moveRightItem);
    }

    var sep2 = elem("div", "col-menu-sep");
    menu.appendChild(sep2);

    // Delete column
    var deleteItem = elem("button", "col-menu-item danger", "Delete column");
    deleteItem.type = "button";
    deleteItem.setAttribute("role", "menuitem");
    deleteItem.addEventListener("click", function () {
      closeColMenu(menu);
      handleDeleteColumn(project, col);
    });
    menu.appendChild(deleteItem);

    menuBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      var isOpen = menu.classList.contains("show");
      closeAllColMenus();
      if (!isOpen) menu.classList.add("show");
    });

    menuWrap.appendChild(menuBtn);
    menuWrap.appendChild(menu);
    head.appendChild(menuWrap);
    colEl.appendChild(head);

    var cardsEl = elem("div", "cards");
    col.taskIds.forEach(function (taskId) {
      var task = byId[taskId];
      if (task) cardsEl.appendChild(renderCard(project, col, task, byId));
    });
    colEl.appendChild(cardsEl);

    colEl.appendChild(renderAddTask(col));
    return colEl;
  }

  function closeColMenu(menu) {
    menu.classList.remove("show");
  }
  function closeAllColMenus() {
    var menus = document.querySelectorAll(".col-menu.show");
    menus.forEach(function (m) {
      m.classList.remove("show");
    });
  }
  // Close column menus when clicking outside.
  document.addEventListener("click", function () {
    closeAllColMenus();
  });

  // Transitions dialog: shows a list of other columns with checkboxes.
  function openTransitionsDialog(project, col) {
    var others = project.columns.filter(function (c) {
      return c.id !== col.id;
    });
    var isRestricted = col.transitions != null;
    var selected = isRestricted ? col.transitions.slice() : [];

    // Build a simple modal-like confirmation using prompt/confirm is too limited.
    // Instead, build a temporary overlay.
    var overlay = elem("div", "overlay show");
    overlay.style.zIndex = "30";
    var modal = elem("div", "modal narrow");
    modal.appendChild(elem("h3", null, "Allowed transitions from " + col.name));

    // Toggle: restrict or unrestricted.
    var toggleWrap = elem("div");
    toggleWrap.style.cssText = "display:flex;align-items:center;gap:8px;margin-bottom:8px;";
    var toggleLabel = elem("label", null, "Restrict destinations");
    toggleLabel.style.cssText = "font-size:13px;color:var(--body);cursor:pointer;";
    var toggleCb = elem("input");
    toggleCb.type = "checkbox";
    toggleCb.checked = isRestricted;
    toggleCb.id = "trans-toggle-" + col.id;
    toggleLabel.setAttribute("for", toggleCb.id);
    toggleWrap.appendChild(toggleCb);
    toggleWrap.appendChild(toggleLabel);
    modal.appendChild(toggleWrap);

    var checklistWrap = elem("div");
    checklistWrap.style.cssText = "display:flex;flex-direction:column;gap:4px;";
    if (!isRestricted) checklistWrap.style.display = "none";

    others.forEach(function (c) {
      var row = elem("label");
      row.style.cssText =
        "display:flex;align-items:center;gap:6px;font-size:13px;color:var(--body);cursor:pointer;padding:4px 0;";
      var cb = elem("input");
      cb.type = "checkbox";
      cb.value = c.id;
      cb.checked = selected.indexOf(c.id) >= 0;
      row.appendChild(cb);
      var txt = document.createTextNode(c.name);
      row.appendChild(txt);
      checklistWrap.appendChild(row);
    });
    modal.appendChild(checklistWrap);

    toggleCb.addEventListener("change", function () {
      checklistWrap.style.display = toggleCb.checked ? "flex" : "none";
    });

    var rowEnd = elem("div", "row-end");
    var cancelBtn = elem("button", "btn", "Cancel");
    cancelBtn.type = "button";
    cancelBtn.addEventListener("click", function () {
      document.body.removeChild(overlay);
    });
    var saveBtn = elem("button", "btn btn-primary", "Save");
    saveBtn.type = "button";
    saveBtn.addEventListener("click", function () {
      var transitions = null;
      if (toggleCb.checked) {
        transitions = [];
        var cbs = checklistWrap.querySelectorAll('input[type="checkbox"]');
        cbs.forEach(function (cb) {
          if (cb.checked) transitions.push(cb.value);
        });
      }
      document.body.removeChild(overlay);
      updateColumn(col.id, { transitions: transitions }).catch(handleError);
    });
    rowEnd.appendChild(cancelBtn);
    rowEnd.appendChild(saveBtn);
    modal.appendChild(rowEnd);

    overlay.appendChild(modal);
    overlay.addEventListener("mousedown", function (e) {
      if (e.target === overlay) document.body.removeChild(overlay);
    });
    document.body.appendChild(overlay);
  }

  // Delete column handler: if empty, confirm and delete; if non-empty, offer relocate.
  function handleDeleteColumn(project, col) {
    if (project.columns.length <= 1) {
      showBanner("Cannot delete the last column.");
      return;
    }
    if (col.taskIds.length === 0) {
      if (window.confirm('Delete empty column "' + col.name + '"?')) {
        deleteColumn(col.id).catch(handleError);
      }
      return;
    }
    // Non-empty: offer relocate with a target selection dialog.
    var others = project.columns.filter(function (c) {
      return c.id !== col.id;
    });
    var overlay = elem("div", "overlay show");
    overlay.style.zIndex = "30";
    var modal = elem("div", "modal narrow");
    modal.appendChild(
      elem(
        "h3",
        null,
        'Delete column "' + col.name + '" (' + col.taskIds.length + " tasks)",
      ),
    );
    modal.appendChild(
      elem("div", null, "Move its tasks to another column before deleting:"),
    );

    var sel = elem("select", "field");
    sel.setAttribute("aria-label", "Target column for relocated tasks");
    others.forEach(function (c) {
      var opt = elem("option", null, c.name);
      opt.value = c.id;
      sel.appendChild(opt);
    });
    modal.appendChild(sel);

    var rowEnd = elem("div", "row-end");
    var cancelBtn = elem("button", "btn", "Cancel");
    cancelBtn.type = "button";
    cancelBtn.addEventListener("click", function () {
      document.body.removeChild(overlay);
    });
    var delBtn = elem("button", "btn btn-primary", "Move & delete");
    delBtn.type = "button";
    delBtn.addEventListener("click", function () {
      var toId = sel.value;
      document.body.removeChild(overlay);
      deleteColumn(col.id, "relocate", toId).catch(handleError);
    });
    rowEnd.appendChild(cancelBtn);
    rowEnd.appendChild(delBtn);
    modal.appendChild(rowEnd);

    overlay.appendChild(modal);
    overlay.addEventListener("mousedown", function (e) {
      if (e.target === overlay) document.body.removeChild(overlay);
    });
    document.body.appendChild(overlay);
  }

  function renderCard(project, col, task, byId) {
    var cardEl = elem("div", "card");

    // Top row: type badge, issue key, parent chip.
    var topRow = elem("div", "card-top-row");
    var taskType = task.type || "task";
    var badge = elem("span", "type-badge type-" + taskType, TYPE_GLYPH[taskType] || "T");
    badge.title = TYPE_LABEL[taskType] || "Task";
    topRow.appendChild(badge);
    if (task.key) {
      topRow.appendChild(elem("span", "issue-key", task.key));
    }
    if (task.parentId && byId) {
      var parent = byId[task.parentId];
      if (parent && parent.key) {
        topRow.appendChild(elem("span", "parent-chip", "↳ " + parent.key));
      }
    }
    cardEl.appendChild(topRow);

    cardEl.appendChild(elem("div", "card-title", task.title));

    // Meta row: assignee, priority, due, deps count.
    var meta = elem("div", "card-meta");
    if (task.assignee) meta.appendChild(elem("span", "chip", task.assignee));
    if (task.priority && PRIORITY_LABEL[task.priority]) {
      meta.appendChild(
        elem("span", "prio prio-" + task.priority, PRIORITY_LABEL[task.priority]),
      );
    }
    if (task.dueDate != null) {
      var overdue = task.dueDate < Date.now();
      meta.appendChild(
        elem("span", "due" + (overdue ? " overdue" : ""), "due " + fmtDate(task.dueDate)),
      );
    }
    if (task.dependsOn && task.dependsOn.length) {
      meta.appendChild(
        elem("span", "deps-badge", "deps: " + task.dependsOn.length),
      );
    }
    if (meta.childNodes.length) cardEl.appendChild(meta);

    if (task.labels && task.labels.length) {
      var labelsEl = elem("div", "card-tags");
      tagChips(labelsEl, task.labels);
      cardEl.appendChild(labelsEl);
    }

    var actions = elem("div", "card-actions");

    // Move dropdown: filter by allowed transitions when set on source column.
    var others = project.columns.filter(function (c) {
      if (c.id === col.id) return false;
      // When source column has transitions set, only show allowed destinations.
      if (col.transitions != null) {
        return col.transitions.indexOf(c.id) >= 0;
      }
      return true;
    });
    if (others.length) {
      var moveSel = elem("select", "move-select");
      moveSel.setAttribute("aria-label", "Move task");
      var placeholder = elem("option", null, "Move ▾");
      placeholder.value = "";
      placeholder.selected = true;
      moveSel.appendChild(placeholder);
      others.forEach(function (c) {
        var opt = elem("option", null, c.name);
        opt.value = c.id;
        moveSel.appendChild(opt);
      });
      moveSel.addEventListener("change", function () {
        var toColumnId = moveSel.value;
        moveSel.selectedIndex = 0;
        if (toColumnId) void moveTask(task.id, toColumnId);
      });
      actions.appendChild(moveSel);
    }

    actions.appendChild(elem("span", "grow"));

    var editBtn = elem("button", "btn btn-ghost", "Edit");
    editBtn.type = "button";
    editBtn.addEventListener("click", function () {
      openEditTask(task);
    });
    actions.appendChild(editBtn);

    var delBtn = elem("button", "btn btn-ghost btn-danger", "Delete");
    delBtn.type = "button";
    delBtn.addEventListener("click", function () {
      if (window.confirm('Delete task "' + task.title + '"?')) {
        deleteTask(task.id).catch(handleError);
      }
    });
    actions.appendChild(delBtn);

    cardEl.appendChild(actions);
    return cardEl;
  }

  function renderAddTask(col) {
    var wrap = elem("div", "add-card");

    var trigger = elem("button", "add-card-trigger", "+ Add task");
    trigger.type = "button";

    var form = elem("form", "add-card-form");
    var input = elem("input", "field");
    input.type = "text";
    input.placeholder = "Task title";
    input.setAttribute("autocomplete", "off");
    var rowEnd = elem("div", "row-end");
    var cancel = elem("button", "btn", "Cancel");
    cancel.type = "button";
    var add = elem("button", "btn btn-primary", "Add");
    add.type = "submit";
    rowEnd.appendChild(cancel);
    rowEnd.appendChild(add);
    form.appendChild(input);
    form.appendChild(rowEnd);

    function open() {
      trigger.style.display = "none";
      form.classList.add("show");
      input.focus();
    }
    function close() {
      form.classList.remove("show");
      trigger.style.display = "";
      input.value = "";
    }

    trigger.addEventListener("click", open);
    cancel.addEventListener("click", close);
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var title = input.value.trim();
      if (!title) return;
      close();
      addTask(col.id, title).catch(handleError);
    });

    wrap.appendChild(trigger);
    wrap.appendChild(form);
    return wrap;
  }

  // ---- List view ------------------------------------------------------------
  var LIST_COLUMNS = [
    { key: "issueKey", label: "Key" },
    { key: "type", label: "Type" },
    { key: "title", label: "Title" },
    { key: "status", label: "Status" },
    { key: "assignee", label: "Assignee" },
    { key: "reporter", label: "Reporter" },
    { key: "priority", label: "Priority" },
    { key: "dueDate", label: "Due" },
    { key: "sprint", label: "Sprint" },
    { key: "deps", label: "#deps" },
  ];

  function renderList(project) {
    var colName = columnNameIndex(project);
    var sprName = sprintNameIndex(project);

    // Build flattened rows with derived fields for sort/filter.
    var rows = (project.tasks || []).map(function (t) {
      return {
        task: t,
        issueKey: t.key || "",
        type: t.type || "task",
        title: t.title || "",
        status: colName[t.columnId] || "",
        assignee: t.assignee || "",
        reporter: t.reporter || "",
        priority: t.priority || "",
        dueDate: t.dueDate != null ? t.dueDate : null,
        sprint: t.sprintId ? sprName[t.sprintId] || "" : "",
        deps: (t.dependsOn && t.dependsOn.length) || 0,
      };
    });

    var filter = state.listFilter.trim().toLowerCase();
    if (filter) {
      rows = rows.filter(function (r) {
        return (
          r.title.toLowerCase().indexOf(filter) >= 0 ||
          r.assignee.toLowerCase().indexOf(filter) >= 0 ||
          r.reporter.toLowerCase().indexOf(filter) >= 0 ||
          r.status.toLowerCase().indexOf(filter) >= 0 ||
          r.sprint.toLowerCase().indexOf(filter) >= 0 ||
          r.issueKey.toLowerCase().indexOf(filter) >= 0 ||
          r.type.toLowerCase().indexOf(filter) >= 0
        );
      });
    }

    var sort = state.listSort;
    rows.sort(function (a, b) {
      var av, bv;
      if (sort.key === "priority") {
        av = a.priority ? PRIORITY_RANK[a.priority] : -1;
        bv = b.priority ? PRIORITY_RANK[b.priority] : -1;
      } else if (sort.key === "dueDate") {
        av = a.dueDate != null ? a.dueDate : Infinity;
        bv = b.dueDate != null ? b.dueDate : Infinity;
      } else if (sort.key === "deps") {
        av = a.deps;
        bv = b.deps;
      } else {
        av = String(a[sort.key]).toLowerCase();
        bv = String(b[sort.key]).toLowerCase();
      }
      if (av < bv) return -1 * sort.dir;
      if (av > bv) return 1 * sort.dir;
      return 0;
    });

    var wrap = elem("div", "list-wrap");

    var toolbar = elem("div", "list-toolbar");
    var filterInput = elem("input", "field");
    filterInput.type = "text";
    filterInput.placeholder = "Filter tasks…";
    filterInput.value = state.listFilter;
    filterInput.style.maxWidth = "260px";
    filterInput.setAttribute("autocomplete", "off");
    filterInput.addEventListener("input", function () {
      state.listFilter = filterInput.value;
      renderContent();
      // Restore focus + caret after re-render.
      var again = el.content.querySelector(".list-toolbar .field");
      if (again) {
        again.focus();
        var len = again.value.length;
        again.setSelectionRange(len, len);
      }
    });
    toolbar.appendChild(filterInput);
    var count = elem("span", "muted", rows.length + " task" + (rows.length === 1 ? "" : "s"));
    toolbar.appendChild(count);
    wrap.appendChild(toolbar);

    var scroll = elem("div", "list-scroll");
    var table = elem("table");
    var thead = elem("thead");
    var htr = elem("tr");
    LIST_COLUMNS.forEach(function (c) {
      var th = elem("th", null, c.label);
      if (sort.key === c.key) {
        th.appendChild(elem("span", "arrow", sort.dir > 0 ? "▲" : "▼"));
      }
      th.addEventListener("click", function () {
        if (state.listSort.key === c.key) state.listSort.dir *= -1;
        else state.listSort = { key: c.key, dir: 1 };
        renderContent();
      });
      htr.appendChild(th);
    });
    thead.appendChild(htr);
    table.appendChild(thead);

    var tbody = elem("tbody");
    if (rows.length === 0) {
      var tr = elem("tr");
      var td = elem("td", "muted", "No tasks match.");
      td.setAttribute("colspan", String(LIST_COLUMNS.length));
      tr.appendChild(td);
      tbody.appendChild(tr);
    } else {
      rows.forEach(function (r) {
        var tr = elem("tr");
        // Key column (monospace).
        var keyTd = elem("td");
        if (r.issueKey) {
          keyTd.appendChild(elem("span", "issue-key", r.issueKey));
        } else {
          keyTd.textContent = "—";
        }
        tr.appendChild(keyTd);
        // Type column (badge).
        var typeTd = elem("td");
        var typeBadge = elem("span", "type-badge type-" + r.type, TYPE_GLYPH[r.type] || "T");
        typeBadge.title = TYPE_LABEL[r.type] || "Task";
        typeTd.appendChild(typeBadge);
        tr.appendChild(typeTd);
        tr.appendChild(elem("td", null, r.title));
        tr.appendChild(elem("td", null, r.status || "—"));
        tr.appendChild(elem("td", null, r.assignee || "—"));
        tr.appendChild(elem("td", null, r.reporter || "—"));
        var ptd = elem("td");
        if (r.priority) {
          ptd.appendChild(
            elem("span", "prio prio-" + r.priority, PRIORITY_LABEL[r.priority]),
          );
        } else {
          ptd.textContent = "—";
        }
        tr.appendChild(ptd);
        tr.appendChild(elem("td", null, r.dueDate != null ? fmtDate(r.dueDate) : "—"));
        tr.appendChild(elem("td", null, r.sprint || "—"));
        tr.appendChild(elem("td", null, String(r.deps)));
        tr.addEventListener("click", function () {
          openEditTask(r.task);
        });
        tbody.appendChild(tr);
      });
    }
    table.appendChild(tbody);
    scroll.appendChild(table);
    wrap.appendChild(scroll);
    return wrap;
  }

  // ---- Sprints view ---------------------------------------------------------
  // ---- Timeline / Gantt view (D7: dependency-free raw SVG) -----------------
  var SVG_NS = "http://www.w3.org/2000/svg";
  var DAY_MS = 86400000;
  function svgEl(tag, attrs) {
    var n = document.createElementNS(SVG_NS, tag);
    if (attrs) for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  function priorityFill(p) {
    return p === "urgent"
      ? "#7a3b2e"
      : p === "high"
        ? "#8a5a2b"
        : p === "medium"
          ? "#5c5348"
          : "#4a453d"; // low / none
  }

  function renderTimeline(project) {
    var wrap = elem("div", "timeline");
    var scheduled = [];
    var unscheduled = [];
    project.tasks.forEach(function (t) {
      if (t.startDate != null && t.dueDate != null && t.dueDate >= t.startDate)
        scheduled.push(t);
      else unscheduled.push(t);
    });

    if (scheduled.length === 0) {
      var ph = elem("div", "placeholder");
      ph.appendChild(
        elem("div", null, "No scheduled tasks. Give a task a start and due date to see it here."),
      );
      wrap.appendChild(ph);
    } else {
      // Group by sprint (in order), then a Backlog group (sprintId null).
      var groups = [];
      project.sprints.forEach(function (s) {
        var ts = scheduled.filter(function (t) {
          return t.sprintId === s.id;
        });
        if (ts.length) groups.push({ name: s.name, tasks: ts });
      });
      var backlog = scheduled.filter(function (t) {
        return !t.sprintId;
      });
      if (backlog.length) groups.push({ name: "Backlog", tasks: backlog });

      // Padded date range across scheduled tasks + sprint bounds.
      var minMs = Infinity;
      var maxMs = -Infinity;
      scheduled.forEach(function (t) {
        if (t.startDate < minMs) minMs = t.startDate;
        if (t.dueDate > maxMs) maxMs = t.dueDate;
      });
      project.sprints.forEach(function (s) {
        if (s.startDate != null && s.startDate < minMs) minMs = s.startDate;
        if (s.endDate != null && s.endDate > maxMs) maxMs = s.endDate;
      });
      minMs -= DAY_MS;
      maxMs += DAY_MS;
      var days = Math.max(1, Math.round((maxMs - minMs) / DAY_MS));
      var PX = days > 90 ? 8 : days > 45 ? 14 : 22; // adaptive px/day
      var LABEL_W = 200;
      var ROW_H = 28;
      var HEADER_H = 26;
      var PAD = 8;
      var chartW = days * PX;
      var totalW = LABEL_W + chartW + PAD * 2;

      var rows = [];
      groups.forEach(function (g) {
        rows.push({ type: "group", name: g.name });
        g.tasks.sort(function (a, b) {
          return a.startDate - b.startDate;
        });
        g.tasks.forEach(function (t) {
          rows.push({ type: "task", task: t });
        });
      });
      var totalH = HEADER_H + rows.length * ROW_H + PAD * 2;
      function xOf(ms) {
        return LABEL_W + PAD + ((ms - minMs) / DAY_MS) * PX;
      }

      var svg = svgEl("svg", {
        width: totalW,
        height: totalH,
        viewBox: "0 0 " + totalW + " " + totalH,
      });
      var defs = svgEl("defs");
      var marker = svgEl("marker", {
        id: "pm-arrow",
        markerWidth: 7,
        markerHeight: 7,
        refX: 6,
        refY: 3,
        orient: "auto",
      });
      marker.appendChild(svgEl("path", { d: "M0,0 L6,3 L0,6 Z", fill: "#c96f4a" }));
      defs.appendChild(marker);
      svg.appendChild(defs);

      // Weekly gridlines (Mondays) with date labels.
      for (var ms = minMs; ms <= maxMs; ms += DAY_MS) {
        if (new Date(ms).getUTCDay() === 1) {
          var gx = xOf(ms);
          svg.appendChild(
            svgEl("line", { x1: gx, y1: HEADER_H, x2: gx, y2: totalH - PAD, stroke: "#3a352f", "stroke-width": 1 }),
          );
          var lbl = svgEl("text", { x: gx + 2, y: 16, fill: "#8a7f6f", "font-size": 10 });
          lbl.textContent = fmtDate(ms);
          svg.appendChild(lbl);
        }
      }
      // Sprint markers (dashed verticals at start/end).
      project.sprints.forEach(function (s) {
        [s.startDate, s.endDate].forEach(function (m) {
          if (m == null) return;
          var mx = xOf(m);
          svg.appendChild(
            svgEl("line", { x1: mx, y1: HEADER_H, x2: mx, y2: totalH - PAD, stroke: "#7a6f60", "stroke-width": 1, "stroke-dasharray": "3 3" }),
          );
        });
      });

      // Rows: group headers + task labels + bars.
      var barOf = {}; // taskId -> {x1,x2,ymid}
      rows.forEach(function (r, i) {
        var y = HEADER_H + i * ROW_H;
        if (r.type === "group") {
          var gt = svgEl("text", { x: PAD, y: y + 18, fill: "#f7f5f0", "font-size": 12, "font-weight": 600 });
          gt.textContent = r.name;
          svg.appendChild(gt);
          return;
        }
        var t = r.task;
        var tl = svgEl("text", { x: PAD + 12, y: y + 18, fill: "#d9cfc0", "font-size": 11 });
        tl.textContent = t.title.length > 26 ? t.title.slice(0, 25) + "…" : t.title;
        var tlTitle = svgEl("title");
        tlTitle.textContent = t.title;
        tl.appendChild(tlTitle);
        svg.appendChild(tl);

        var bx = xOf(t.startDate);
        var bw = Math.max(PX * 0.6, xOf(t.dueDate + DAY_MS) - bx); // due day inclusive
        var rect = svgEl("rect", {
          x: bx,
          y: y + 6,
          width: bw,
          height: ROW_H - 12,
          rx: 3,
          fill: priorityFill(t.priority),
          stroke: "#7a6f60",
          "stroke-width": 1,
        });
        rect.style.cursor = "pointer";
        var rt = svgEl("title");
        rt.textContent = t.title + " · " + fmtDate(t.startDate) + "–" + fmtDate(t.dueDate);
        rect.appendChild(rt);
        rect.addEventListener("click", function () {
          openEditTask(t);
        });
        svg.appendChild(rect);
        barOf[t.id] = { x1: bx, x2: bx + bw, ymid: y + ROW_H / 2 };
      });

      // Dependency connectors: predecessor end -> successor start, only when
      // both endpoints are scheduled (on the chart). Date-less endpoints are
      // surfaced in the Unscheduled tray + the task's dep count instead.
      rows.forEach(function (r) {
        if (r.type !== "task") return;
        (r.task.dependsOn || []).forEach(function (depId) {
          var from = barOf[depId];
          var to = barOf[r.task.id];
          if (!from || !to) return;
          svg.appendChild(
            svgEl("line", {
              x1: from.x2,
              y1: from.ymid,
              x2: to.x1 - 2,
              y2: to.ymid,
              stroke: "#c96f4a",
              "stroke-width": 1.5,
              "marker-end": "url(#pm-arrow)",
            }),
          );
        });
      });

      var scroller = elem("div", "gantt-scroll");
      scroller.style.cssText =
        "overflow-x:auto;overflow-y:hidden;border:1px solid #3a352f;border-radius:6px;background:#241f1b;padding:2px;";
      scroller.appendChild(svg);
      wrap.appendChild(scroller);
    }

    // Unscheduled tray.
    if (unscheduled.length) {
      var tray = elem("div", "gantt-tray");
      tray.style.cssText = "margin-top:14px;";
      tray.appendChild(elem("h3", null, "Unscheduled (" + unscheduled.length + ")"));
      var hint = elem("div", null, "Tasks missing a start or due date. Click one to schedule it.");
      hint.style.cssText = "color:#8a7f6f;font-size:11px;margin:2px 0 6px;";
      tray.appendChild(hint);
      unscheduled.forEach(function (t) {
        var chip = elem("button", null, t.title);
        chip.type = "button";
        chip.style.cssText =
          "display:inline-block;margin:3px;padding:4px 8px;border:1px solid #7a6f60;border-radius:12px;background:#332e28;color:#d9cfc0;cursor:pointer;font-size:11px;";
        if (t.dependsOn && t.dependsOn.length) {
          chip.appendChild(elem("span", null, " · deps: " + t.dependsOn.length));
        }
        chip.addEventListener("click", function () {
          openEditTask(t);
        });
        tray.appendChild(chip);
      });
      wrap.appendChild(tray);
    }
    return wrap;
  }

  function renderSprints(project) {
    var byId = taskIndex(project);

    // Group tasks by sprintId. Order within a lane follows tasks[] order.
    var backlog = [];
    var bySprint = {};
    (project.sprints || []).forEach(function (s) {
      bySprint[s.id] = [];
    });
    (project.tasks || []).forEach(function (t) {
      if (t.sprintId && bySprint[t.sprintId]) bySprint[t.sprintId].push(t);
      else backlog.push(t);
    });

    var wrap = elem("div", "sprints");

    wrap.appendChild(renderLane(project, null, "Backlog", null, null, backlog));
    (project.sprints || []).forEach(function (s) {
      wrap.appendChild(
        renderLane(project, s.id, s.name, s.startDate, s.endDate, bySprint[s.id] || []),
      );
    });

    // Trailing "New sprint" affordance.
    var addLane = elem("div", "lane-add");
    var addBtn = elem("button", "btn", "+ New sprint");
    addBtn.type = "button";
    addBtn.addEventListener("click", openNewSprint);
    addLane.appendChild(addBtn);
    wrap.appendChild(addLane);

    return wrap;
  }

  function renderLane(project, sprintId, name, startDate, endDate, tasks) {
    var lane = elem("div", "lane");

    var head = elem("div", "lane-head");
    head.appendChild(elem("span", "lane-name", name));
    if (startDate != null || endDate != null) {
      var range =
        (startDate != null ? fmtDate(startDate) : "…") +
        " – " +
        (endDate != null ? fmtDate(endDate) : "…");
      head.appendChild(elem("span", "lane-dates", range));
    }
    var spacer = elem("span");
    spacer.style.marginLeft = "auto";
    head.appendChild(spacer);
    head.appendChild(elem("span", "lane-dates", String(tasks.length)));
    if (sprintId) {
      var del = elem("button", "btn btn-ghost btn-danger", "×");
      del.type = "button";
      del.title = "Delete sprint";
      del.style.marginLeft = "6px";
      del.addEventListener("click", function () {
        if (
          window.confirm(
            'Delete sprint "' +
              name +
              '"? Its tasks move back to the backlog.',
          )
        ) {
          deleteSprint(sprintId).catch(handleError);
        }
      });
      head.appendChild(del);
    }
    lane.appendChild(head);

    var body = elem("div", "lane-body");
    if (tasks.length === 0) {
      body.appendChild(elem("div", "muted", "No tasks."));
    }
    tasks.forEach(function (t) {
      body.appendChild(renderLaneTask(project, t, sprintId));
    });
    lane.appendChild(body);
    return lane;
  }

  function renderLaneTask(project, task, currentSprintId) {
    var node = elem("div", "lane-task");

    var title = elem("div", "lane-task-title", task.title);
    node.appendChild(title);

    if (task.priority && PRIORITY_LABEL[task.priority]) {
      var meta = elem("div", "card-meta");
      meta.appendChild(
        elem("span", "prio prio-" + task.priority, PRIORITY_LABEL[task.priority]),
      );
      node.appendChild(meta);
    }

    // Sprint move select (field edit, LWW): Backlog + each sprint.
    var sel = elem("select", "sprint-select");
    sel.setAttribute("aria-label", "Move task to sprint");
    var backOpt = elem("option", null, "— Backlog —");
    backOpt.value = "";
    if (!currentSprintId) backOpt.selected = true;
    sel.appendChild(backOpt);
    (project.sprints || []).forEach(function (s) {
      var opt = elem("option", null, s.name);
      opt.value = s.id;
      if (s.id === currentSprintId) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.addEventListener("change", function () {
      var next = sel.value || null;
      if (next !== (currentSprintId || null)) {
        setTaskSprint(task.id, next).catch(handleError);
      }
    });
    node.appendChild(sel);

    return node;
  }

  // ---------------------------------------------------------------------------
  // Modals
  // ---------------------------------------------------------------------------
  function openOverlay(overlay) {
    overlay.classList.add("show");
  }
  function closeOverlay(overlay) {
    overlay.classList.remove("show");
  }

  document.querySelectorAll("[data-close]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      closeOverlay(document.getElementById(btn.getAttribute("data-close")));
    });
  });
  [el.newProjectOverlay, el.newSprintOverlay, el.editTaskOverlay].forEach(
    function (ov) {
      ov.addEventListener("mousedown", function (e) {
        if (e.target === ov) closeOverlay(ov);
      });
    },
  );
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      closeOverlay(el.newProjectOverlay);
      closeOverlay(el.newSprintOverlay);
      closeOverlay(el.editTaskOverlay);
    }
  });

  function openNewSprint() {
    if (!state.project) return;
    el.nsName.value = "";
    el.nsStart.value = "";
    el.nsEnd.value = "";
    openOverlay(el.newSprintOverlay);
    el.nsName.focus();
  }

  // Helper: given a child type, return the set of valid parent types (or null for "none").
  function validParentTypes(childType) {
    switch (childType) {
      case "epic":
        return []; // no parent allowed
      case "story":
      case "task":
      case "bug":
        return [null, "epic"]; // none or epic
      case "subtask":
        return ["story", "task", "bug"]; // must have parent (one of these types)
      default:
        return [null, "epic"];
    }
  }

  // Rebuild the parent select for the current type selection.
  function rebuildParentOptions(project, taskId, selectedType, currentParentId) {
    el.etParent.textContent = "";
    var allowed = validParentTypes(selectedType);
    // If the type forbids any parent (e.g. epic), show only "(none)".
    if (allowed.length === 0 || (allowed.length === 1 && allowed[0] === null)) {
      var opt = elem("option", null, "— None —");
      opt.value = "";
      el.etParent.appendChild(opt);
      el.etParent.value = "";
      // For epic: disable the parent select.
      if (selectedType === "epic") {
        el.etParent.disabled = true;
      }
      return;
    }
    el.etParent.disabled = false;
    // Subtask requires a parent — no "(none)" option.
    if (selectedType !== "subtask") {
      var noneOpt = elem("option", null, "— None —");
      noneOpt.value = "";
      el.etParent.appendChild(noneOpt);
    }
    // Filter tasks to allowed parent types.
    var allowedParentTypeSet = allowed.filter(function (t) {
      return t !== null;
    });
    (project.tasks || []).forEach(function (t) {
      if (t.id === taskId) return;
      var tType = t.type || "task";
      if (allowedParentTypeSet.indexOf(tType) < 0) return;
      var label = (t.key || t.id) + " — " + t.title;
      var opt = elem("option", null, label);
      opt.value = t.id;
      if (t.id === currentParentId) opt.selected = true;
      el.etParent.appendChild(opt);
    });
    el.etParent.value = currentParentId || "";
  }

  function openEditTask(task) {
    var project = state.project;
    if (!project) return;
    state.editingTaskId = task.id;

    // Read-only fields.
    el.etKey.textContent = task.key || "—";
    el.etReporter.textContent = task.reporter || "—";

    el.etTitle.value = task.title || "";
    el.etDesc.value = task.description || "";
    el.etAssignee.value = task.assignee || "";
    el.etPriority.value = task.priority || "";
    el.etStart.value = msToDateInput(task.startDate);
    el.etDue.value = msToDateInput(task.dueDate);
    el.etLabels.value = (task.labels || []).join(", ");

    // Type select.
    el.etType.value = task.type || "task";

    // Parent select: populate based on selected type.
    rebuildParentOptions(project, task.id, el.etType.value, task.parentId);

    // Rebuild parent options when type changes.
    el.etType.onchange = function () {
      rebuildParentOptions(project, task.id, el.etType.value, null);
    };

    // Sprint select: Backlog + each sprint.
    el.etSprint.textContent = "";
    var back = elem("option", null, "— Backlog —");
    back.value = "";
    el.etSprint.appendChild(back);
    (project.sprints || []).forEach(function (s) {
      var opt = elem("option", null, s.name);
      opt.value = s.id;
      el.etSprint.appendChild(opt);
    });
    el.etSprint.value = task.sprintId || "";

    // Dependencies multi-select: OTHER tasks in the project, showing keys.
    el.etDeps.textContent = "";
    var deps = task.dependsOn || [];
    (project.tasks || []).forEach(function (t) {
      if (t.id === task.id) return;
      var label = (t.key || t.id) + " — " + t.title;
      var opt = elem("option", null, label);
      opt.value = t.id;
      if (deps.indexOf(t.id) >= 0) opt.selected = true;
      el.etDeps.appendChild(opt);
    });

    // ---- Collaboration sections: clear stale data, then load fresh ----
    // Clear all collab sections immediately (prevents flash of previous task's data).
    el.etWatchersChips.textContent = "";
    el.etWatchersCount.textContent = "";
    el.etCommentList.textContent = "";
    el.etCommentsCount.textContent = "";
    el.etCommentBody.value = "";
    el.etAttList.textContent = "";
    el.etAttachmentsCount.textContent = "";
    el.etAttFile.value = "";
    el.etActivityList.textContent = "";

    // Show watchers from the already-loaded project data (no extra request).
    renderWatchers(task.watchers || []);

    // Load comments, attachments, and activity in parallel.
    var pid = project.id;
    var tid = task.id;
    Promise.all([
      loadCommentsForTask(tid, pid).catch(function () {}),
      loadAttachmentsForTask(tid, pid).catch(function () {}),
      loadActivityForTask(pid, tid).catch(function () {}),
    ]);

    openOverlay(el.editTaskOverlay);
    el.etTitle.focus();
  }

  // ---------------------------------------------------------------------------
  // Wiring
  // ---------------------------------------------------------------------------
  el.projectSelect.addEventListener("change", function () {
    var id = el.projectSelect.value;
    if (id) void loadProject(id);
  });

  el.viewSwitch.querySelectorAll("button[data-view]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var v = btn.getAttribute("data-view");
      if (v && v !== state.view) {
        state.view = v;
        renderContent();
      }
    });
  });

  el.newProjectBtn.addEventListener("click", function () {
    el.npName.value = "";
    el.npTags.value = "";
    openOverlay(el.newProjectOverlay);
    el.npName.focus();
  });

  el.deleteProjectBtn.addEventListener("click", function () {
    if (!state.project) return;
    if (
      window.confirm(
        'Delete project "' +
          state.project.name +
          '" and all its tasks? This cannot be undone.',
      )
    ) {
      deleteProject(state.project.id).catch(handleError);
    }
  });

  el.newProjectForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var name = el.npName.value.trim();
    if (!name) return;
    var tags = parseCsv(el.npTags.value);
    closeOverlay(el.newProjectOverlay);
    createProject(name, tags).catch(handleError);
  });

  el.newSprintForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var name = el.nsName.value.trim();
    if (!name) return;
    var start = dateInputToMs(el.nsStart.value);
    var end = dateInputToMs(el.nsEnd.value);
    closeOverlay(el.newSprintOverlay);
    createSprint(name, start, end).catch(handleError);
  });

  el.editTaskForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var id = state.editingTaskId;
    if (!id) return;
    var title = el.etTitle.value.trim();
    if (!title) return;
    // Explicit nulls clear dates/sprint; JSON keeps null, drops undefined.
    var patch = {
      title: title,
      description: el.etDesc.value,
      type: el.etType.value || "task",
      parentId: el.etParent.value || null,
      assignee: el.etAssignee.value.trim(),
      priority: el.etPriority.value || null,
      labels: parseCsv(el.etLabels.value),
      startDate: dateInputToMs(el.etStart.value),
      dueDate: dateInputToMs(el.etDue.value),
      sprintId: el.etSprint.value || null,
      dependsOn: Array.from(el.etDeps.selectedOptions).map(function (o) {
        return o.value;
      }),
    };
    closeOverlay(el.editTaskOverlay);
    updateTask(id, patch).catch(handleError);
  });

  // ---------------------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------------------
  renderViewSwitch();
  void loadProjects();
  startNotifPolling();
</script>
